<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px;
    height: 720px;
    background: #030308;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    position: relative;
  }
  
  /* Fiery gradient background — MrBeast / MKBHD style high energy */
  .bg {
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(ellipse at 25% 40%, rgba(247,147,26,0.5) 0%, transparent 55%),
      radial-gradient(ellipse at 75% 60%, rgba(255,50,50,0.3) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 20%, rgba(0,255,204,0.2) 0%, transparent 50%),
      linear-gradient(180deg, #0a0a1a 0%, #1a0a2e 50%, #0a0a1a 100%);
  }
  
  /* Dramatic light rays */
  .rays {
    position: absolute;
    inset: 0;
    background: 
      linear-gradient(135deg, transparent 30%, rgba(247,147,26,0.08) 50%, transparent 70%),
      linear-gradient(225deg, transparent 30%, rgba(0,255,204,0.06) 50%, transparent 70%);
  }

  /* Content */
  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 50px;
    z-index: 10;
  }
  
  /* Big emoji row — YouTube clickbait style */
  .emoji-row {
    font-size: 64px;
    margin-bottom: 10px;
    filter: drop-shadow(0 4px 20px rgba(0,0,0,0.5));
  }
  
  /* Main headline — HUGE, bold, outlined */
  .headline {
    font-size: 92px;
    font-weight: 900;
    text-align: center;
    line-height: 1.0;
    letter-spacing: -3px;
    color: white;
    text-shadow: 
      0 0 40px rgba(247,147,26,0.5),
      0 4px 0 rgba(0,0,0,0.8),
      0 8px 30px rgba(0,0,0,0.6);
  }
  
  .headline .orange {
    background: linear-gradient(180deg, #ffb347 0%, #f7931a 50%, #e67e00 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 3px 0 rgba(0,0,0,0.8));
  }
  
  .headline .cyan {
    background: linear-gradient(180deg, #66ffee 0%, #00ffcc 50%, #00cc99 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 3px 0 rgba(0,0,0,0.8));
  }
  
  .headline .white {
    color: #ffffff;
    -webkit-text-fill-color: #ffffff;
  }
  
  /* Subline */
  .subline {
    font-size: 36px;
    font-weight: 700;
    color: rgba(255,255,255,0.85);
    margin-top: 16px;
    text-align: center;
    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    letter-spacing: 1px;
  }
  
  .subline .gold {
    color: #f7931a;
  }
  
  /* Bottom stat bar — social proof */
  .stat-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 72px;
    background: rgba(0,0,0,0.7);
    border-top: 3px solid #f7931a;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 50px;
  }
  
  .stat {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .stat .num {
    font-size: 26px;
    font-weight: 900;
    color: #f7931a;
  }
  
  .stat .label {
    font-size: 18px;
    font-weight: 600;
    color: rgba(255,255,255,0.7);
  }
  
  /* Corner accent — "NEW" or "LIVE" style badge */
  .corner-badge {
    position: absolute;
    top: 20px;
    right: 20px;
    background: #ff3333;
    color: white;
    font-size: 22px;
    font-weight: 900;
    padding: 8px 20px;
    border-radius: 8px;
    letter-spacing: 2px;
    box-shadow: 0 4px 20px rgba(255,50,50,0.5);
    z-index: 20;
  }
  
  /* Brand watermark */
  .brand {
    position: absolute;
    top: 24px;
    left: 30px;
    font-size: 22px;
    font-weight: 800;
    z-index: 20;
    letter-spacing: 1px;
    background: linear-gradient(135deg, #00ffcc, #f7931a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6));
  }
  
  /* Glow orbs */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(50px);
  }
  .orb1 { width: 250px; height: 250px; background: rgba(247,147,26,0.35); top: -50px; left: 30%; }
  .orb2 { width: 200px; height: 200px; background: rgba(0,255,204,0.2); bottom: 80px; right: 10%; }
  .orb3 { width: 180px; height: 180px; background: rgba(168,85,247,0.2); top: 40%; left: 5%; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="rays"></div>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  
  <div class="brand">BLOCK GENOMICS</div>
  <div class="corner-badge">🔴 LIVE</div>
  
  <div class="content">
    <div class="emoji-row">🤖⚡🦞🧬</div>
    <div class="headline">
      <span class="cyan">AI AGENTS</span><br>
      <span class="white">FOR YOUR</span> <span class="orange">BITCOIN</span>
    </div>
    <div class="subline">
      Every Block Has a Guardian 🛡️ <span class="gold">The Nexus is LIVE</span>
    </div>
  </div>
  
  <div class="stat-bar">
    <div class="stat">
      <span class="num">937,000+</span>
      <span class="label">Bitcoin Blocks</span>
    </div>
    <div class="stat">
      <span class="num">🧬</span>
      <span class="label">Unique DNA</span>
    </div>
    <div class="stat">
      <span class="num">⚡</span>
      <span class="label">Lightning Payments</span>
    </div>
    <div class="stat">
      <span class="num">🏗️</span>
      <span class="label">Build Anything</span>
    </div>
  </div>
</body>
</html>
