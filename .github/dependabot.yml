# Dependabot configuration for Block Genomics Nexus.
#
# This tree is a monorepo WITHOUT npm workspaces: every directory below carries
# its own package.json (and, where it is installed with `npm ci` in CI, its own
# package-lock.json), so each one needs its own update entry. Directories are
# kept in sync with the working-directory values in .github/workflows/ci.yml.
#
# Grouping: minor+patch version updates arrive as ONE PR per directory, majors
# stay separate (they need a human), and security fixes arrive as ONE PR per
# directory instead of one PR per package.
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      npm-root-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-root-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
