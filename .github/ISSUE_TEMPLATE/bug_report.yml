name: Bug report
description: Report a reproducible product or developer-facing bug.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: List the exact steps, command, endpoint, or UI path.
      placeholder: |
        1. Go to ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, Node version, app route, API endpoint, or wallet adapter if relevant.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have not included secrets, seed phrases, private keys, or sensitive wallet data.
          required: true
