# OpenSSF Scorecard: scores the repository's supply-chain practices (pinned
# actions, token permissions, branch protection, and more) once a week, on each
# push to main and when a branch protection rule changes.
#
# Triggers: push to main, a weekly schedule (Mondays 14:23 UTC) and
# branch_protection_rule. There is no pull_request trigger, so code from a pull
# request, a fork's included, never runs here and never sees this workflow's
# token.
#
# Permissions: read-all at the top. The job adds `security-events: write`, the
# one write permission of this workflow, so the upload step can put its SARIF
# file into this repository's code scanning tab; `contents: read` and
# `actions: read` let Scorecard read the repository and its workflow runs. It
# uses no secret. `publish_results: false`: nothing is sent to the public
# Scorecard site. The code scanning merge rule of docs/RUNBOOK-CICD.md names
# CodeQL as its tool, so a Scorecard result never blocks a merge.
#
# Every action is pinned by commit SHA; the checkout keeps no git credential.

name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 14 * * 1'
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
          category: scorecard
