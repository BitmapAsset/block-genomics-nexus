# Tag-triggered release for the three public npm packages in this tree:
#   - block-genomics-connect  (sdk/agent-connect)
#   - block-genomics-mcp      (packages/bg-mcp)
#   - block-genomics          (cli)
# followed by a GitHub Release with auto-generated notes.
#
# How to cut a release, and the one-time npm Trusted Publisher setup for each
# package, are in RELEASING.md. In short:
#
#   * Publishing uses npm Trusted Publishing (OIDC). There is no NPM_TOKEN in
#     this repo and there should never be one. Until npmjs.com trusts this
#     workflow for a package, that package's publish leg fails with a 404/403:
#     that means "trusted publisher not set up yet", not "bad workflow".
#   * Any `v*` tag on a commit that is on `main` runs this. Every package is
#     considered; a package whose package.json version is already on npm is
#     skipped, so bumping one package does not fail the others.
#   * The GitHub Release is created only after every publish leg succeeded or
#     skipped, so a Release never announces a package that failed to publish.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Never run two releases of the same tag at once, never cancel one midway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # A tag can point at any commit, including one on an unmerged branch that
      # never passed review. Only release what is already on main.
      - name: Tagged commit must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Tag a commit on main."
            exit 1
          fi
      # No dependency cache anywhere in this workflow: a release builds from a
      # clean install, so nothing restored from an earlier run can end up in
      # a published tarball (cache poisoning).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: sdk tests
        working-directory: sdk/agent-connect
        run: npm ci && npm run build && npm test
      - name: mcp tests
        working-directory: packages/bg-mcp
        run: npm ci && npm test
      - name: cli tests
        working-directory: cli
        # `npm test` is bare `vitest`; `vitest run` can never enter watch mode.
        run: npm ci && npm run build && npx vitest run

  publish:
    name: publish ${{ matrix.package }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One package failing (for example, no trusted publisher yet) must not
      # cancel the others mid-publish.
      fail-fast: false
      matrix:
        include:
          - package: block-genomics-connect
            dir: sdk/agent-connect
          - package: block-genomics-mcp
            dir: packages/bg-mcp
          - package: block-genomics
            dir: cli
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # npm Trusted Publishing requires Node >= 22.14 and npm >= 11.5.1
      # (docs.npmjs.com/trusted-publishers). The previous Node 20 + `npm@latest`
      # combination met neither: Node 20 is below the floor, and npm@latest is
      # now npm 12, which refuses to run on Node 20 at all. The tests above
      # run on Node 22, the line CI tests (see ci.yml).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Pinned to the npm 11 line so a future npm major cannot break a release.
      - name: Pin npm for trusted publishing
        run: npm install -g npm@11 && npm --version
      - name: Check the package and skip if this version is already published
        id: check
        env:
          EXPECTED: ${{ matrix.package }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$name" != "$EXPECTED" ]; then
            echo "::error::$PWD/package.json is $name, expected $EXPECTED"
            exit 1
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm — skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing $name@$version."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: steps.check.outputs.publish == 'true'
        run: npm ci && npm run build
      - name: Publish with provenance
        if: steps.check.outputs.publish == 'true'
        run: npm publish --provenance --access public

  github-release:
    name: github-release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      # Idempotent: re-running the workflow for a tag that already has a
      # Release leaves that Release (and any hand edits to it) alone.
      - name: Create the GitHub Release with generated notes
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — leaving it unchanged."
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
