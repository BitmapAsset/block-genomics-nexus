# CI for the Block Genomics Nexus monorepo.
#
# This tree is a set of independent npm packages (no npm workspaces), so each
# job installs from its own package-lock.json. Every suite below was verified
# green before this workflow was added; jobs run in parallel and finish in ~2 min.
#
# Job names double as branch-protection status checks: sdk, mcp, cli, app,
# lint, typecheck, example, build, secrets, migrations, resolver, workflows. Keep every
# `name:` stable; renaming one silently orphans its required check.
#
# Every job carries a 15-minute timeout (the slowest, `build`, takes ~2 min).
# The GitHub default is 360 minutes, so a hung step would otherwise hold the
# PR and a runner for six hours.
#
# `app` (jest), `lint` (eslint) and `build` (next build) are separate jobs rather
# than steps of one: they are independent failure modes, and as steps a lint
# failure would mask whether the app still builds. They run in parallel, so the
# extra `npm ci` costs setup time, not wall-clock.
#
# Every job runs on Node 22. Node 20 reached end of life on 2026-04-30 and
# Vercel stopped building with it on 2026-10-01; Vercel now offers only 22.x
# and 24.x. app/package.json pins no `engines`, so the Vercel project's
# Node.js setting decides production. Keep this line equal to that setting
# (or pin `engines.node` in app/package.json and read it here with
# `node-version-file`).
#
# Every action is pinned by commit SHA to a release that runs on the Node 24
# action runtime. GitHub removed Node 20 from its runners on 2026-09-23 and
# force-runs older pins on Node 24, so a Node 20 pin is running on a runtime
# its authors never tested.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PRs: one group per PR ref, so a new push cancels that PR's stale run (it can
# no longer merge anyway). main: one group per commit sha, so no main run ever
# shares a group with another and none is cancelled, running or pending. Every
# merge commit keeps its own complete verdict, so a red main can always be
# bisected to the commit that broke it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdk:
    name: sdk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/agent-connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/agent-connect/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  mcp:
    name: mcp
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/bg-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/bg-mcp/package-lock.json
      - run: npm ci
      # `npm test` here is `npm run build && vitest run`, so the build is covered.
      # The live smoke suite stays skipped: it needs BG_LIVE_SMOKE=1 and a real API.
      - run: npm test

  resolver:
    name: resolver
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/bitmap-resolver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/bitmap-resolver/package-lock.json
      - run: npm ci
      # `npm test` is `npm run build && vitest run`. The suite replays recorded
      # vectors with the global fetch stubbed, so it never calls ordinals.com;
      # the live suite stays skipped without BITMAP_LIVE_TESTS=1.
      - run: npm test

  cli:
    name: cli
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - run: npm run build
      # `npm test` is bare `vitest`; call `vitest run` so CI can never enter watch mode.
      - run: npx vitest run

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    # `build` type-checks only what `next build` compiles, which excludes
    # `__tests__`. Type errors in the test tree were therefore invisible to CI
    # and only visible to whoever ran `tsc` by hand. This job covers the whole
    # tsconfig, test files included.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # @prisma/client's types are generated, so tsc cannot resolve model
      # argument types without this.
      - run: npx prisma generate
      # Verified clean both with and without a prior `next build` present, so
      # this does not depend on `.next/types` having been generated first.
      - run: npx tsc --noEmit

  app:
    name: app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Jest reaches @prisma/client through src/lib; generate the client explicitly
      # rather than relying on the install postinstall hook firing.
      - run: npx prisma generate
      # Verified to pass with DATABASE_URL unset — the suite never opens a connection.
      - run: npm test

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    # A stock postgres image, not Supabase: a self-hoster's database has none of
    # the roles, extensions or tables the hosted project happens to carry, so
    # this is the environment that catches migrations written from live
    # introspection.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bgnexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_POSTGRES_PRISMA_URL: postgresql://postgres:postgres@localhost:5432/bgnexus?schema=public
      DATABASE_POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@localhost:5432/bgnexus?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci

      # 1. The whole chain has to apply to an empty database. This is the check
      #    that would have caught 20260721041500_codify_rls_policies enabling RLS
      #    on tables no migration ever created.
      - name: Replay every migration from an empty database
        run: npx prisma migrate deploy

      # 2. Applying twice has to be a no-op. A migration that only works once
      #    breaks any redeploy and any restore-then-catch-up.
      - name: Re-run migrations (must report nothing pending)
        run: npx prisma migrate deploy

      # 3. The end state has to equal schema.prisma. Without this, a model added
      #    by `prisma db push` still looks fine above -- it simply never gets
      #    created, and the drift only surfaces at runtime as a missing table.
      - name: Fail on drift between the migration chain and schema.prisma
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_POSTGRES_PRISMA_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # `eslint .`, not `next lint` — the latter is removed in Next 16.
      # Fails on errors only; the pre-existing warning backlog is not a gate.
      - run: npm run lint

  example:
    name: example
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/reference-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/reference-agent/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # The suite signs with this example's signer and verifies with the app's
      # own verifier module, so a signer/verifier divergence fails here rather
      # than in someone's first agent.
      - run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # `npm run build` is `prisma generate && next build`, with a prebuild hook
      # that regenerates the protocol content. Verified to pass with DATABASE_URL
      # unset — nothing in the build opens a connection. next.config.ts sets
      # neither `eslint.ignoreDuringBuilds` nor `typescript.ignoreBuildErrors`,
      # so this also gates type errors.
      - run: npm run build

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Free for public repositories — no GITLEAKS_LICENSE required.
      # Honours the repo-root .gitleaks.toml.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Lints every file in .github/workflows (syntax, expressions, runner
    # labels, `needs` graphs) and shellchecks each `run:` block. A broken
    # workflow otherwise only shows up when its trigger fires, which for
    # release.yml, migrate-production.yml and post-deploy-smoke.yml means
    # in the middle of a release, a migration or a production deploy.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The official image bundles shellcheck. Tag plus digest: the digest is
      # what runs, the tag says which release it is.
      - uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
