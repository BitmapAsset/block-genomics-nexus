<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 400px; height: 400px; overflow: hidden; background: #000; }

  .pfp {
    width: 400px;
    height: 400px;
    position: relative;
    background: radial-gradient(circle at 50% 50%, #0d1b2a 0%, #050a12 60%, #000000 100%);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Rotating outer ring */
  .outer-ring {
    position: absolute;
    width: 340px;
    height: 340px;
    border-radius: 50%;
    border: 2px solid rgba(0,255,204,0.15);
    animation: spin 20s linear infinite;
  }
  .outer-ring::before {
    content: '';
    position: absolute;
    top: -4px;
    left: 50%;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ffcc;
    box-shadow: 0 0 12px rgba(0,255,204,0.8);
  }

  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* Inner glow ring */
  .inner-ring {
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    border: 1px solid rgba(247,147,26,0.2);
    animation: spin 15s linear infinite reverse;
  }
  .inner-ring::before {
    content: '';
    position: absolute;
    bottom: -3px;
    left: 50%;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #f7931a;
    box-shadow: 0 0 10px rgba(247,147,26,0.8);
  }

  /* Central hexagon container */
  .hex-container {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Bitcoin symbol */
  .btc-symbol {
    font-size: 100px;
    font-weight: 900;
    background: linear-gradient(135deg, #f7931a 0%, #ffb347 40%, #f7931a 60%, #ff6600 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 20px rgba(247,147,26,0.5)) drop-shadow(0 0 40px rgba(247,147,26,0.2));
    line-height: 1;
    font-family: -apple-system, 'SF Pro Display', 'Inter', sans-serif;
  }

  /* BG text */
  .bg-text {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 14px;
    color: rgba(255,255,255,0.7);
    text-transform: uppercase;
    margin-top: 4px;
    font-family: -apple-system, 'SF Pro Display', 'Inter', sans-serif;
    text-shadow: 0 0 20px rgba(0,255,204,0.3);
  }

  /* Ambient glow behind symbol */
  .ambient-glow {
    position: absolute;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(247,147,26,0.2) 0%, rgba(0,255,204,0.05) 50%, transparent 70%);
    filter: blur(20px);
    z-index: 5;
  }

  /* Corner data points */
  .data-point {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(0,255,204,0.4);
  }

  /* Hex grid pattern */
  .hex-grid {
    position: absolute;
    inset: 0;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='52' viewBox='0 0 60 52' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0l30 15v22L30 52 0 37V15z' fill='none' stroke='%2300ffcc' stroke-width='0.5'/%3E%3C/svg%3E");
    background-size: 60px 52px;
  }

  /* Genome strand decoration */
  .genome-strand {
    position: absolute;
    width: 100%;
    height: 2px;
    opacity: 0.08;
  }
  .genome-strand.top {
    top: 80px;
    background: linear-gradient(90deg, transparent, #00ffcc, #f7931a, transparent);
  }
  .genome-strand.bottom {
    bottom: 80px;
    background: linear-gradient(90deg, transparent, #f7931a, #00ffcc, transparent);
  }
</style>
</head>
<body>
<div class="pfp">
  <!-- Hex grid background -->
  <div class="hex-grid"></div>

  <!-- Genome strands -->
  <div class="genome-strand top"></div>
  <div class="genome-strand bottom"></div>

  <!-- Rings -->
  <div class="outer-ring"></div>
  <div class="inner-ring"></div>

  <!-- Data points -->
  <div class="data-point" style="top: 40px; left: 60px;"></div>
  <div class="data-point" style="top: 70px; right: 80px;"></div>
  <div class="data-point" style="bottom: 50px; left: 90px;"></div>
  <div class="data-point" style="bottom: 80px; right: 60px;"></div>
  <div class="data-point" style="top: 120px; left: 30px;"></div>
  <div class="data-point" style="bottom: 130px; right: 40px;"></div>

  <!-- Central -->
  <div class="ambient-glow"></div>
  <div class="hex-container">
    <div class="btc-symbol">₿</div>
    <div class="bg-text">NEXUS</div>
  </div>
</div>
</body>
</html>
