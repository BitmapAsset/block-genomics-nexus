<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Genomics — 3D Logo Concept</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a12;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }

  /* Circuit board background */
  .bg-circuits {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 50% 50%, rgba(247,147,26,0.03) 0%, transparent 60%),
      radial-gradient(circle at 20% 80%, rgba(0,200,255,0.02) 0%, transparent 40%),
      linear-gradient(180deg, #0a0a12 0%, #0d0d1a 100%);
  }
  .bg-circuits::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(247,147,26,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(247,147,26,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* Main logo container */
  .logo-container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  /* The B symbol */
  .logo-b {
    position: relative;
    font-size: 180px;
    font-weight: 900;
    font-family: 'Arial Black', 'Segoe UI Black', sans-serif;
    line-height: 1;
    color: transparent;
    background: linear-gradient(160deg, #e8e8f0 0%, #8a8a9a 30%, #c0c0cc 50%, #6a6a7a 70%, #9a9aaa 100%);
    -webkit-background-clip: text;
    background-clip: text;
    filter: drop-shadow(0 0 30px rgba(247,147,26,0.4)) drop-shadow(0 4px 20px rgba(0,0,0,0.8));
    text-shadow: none;
    user-select: none;
  }

  /* Orange glow edges */
  .logo-b::before {
    content: '₿';
    position: absolute;
    inset: 0;
    font-size: inherit;
    font-weight: inherit;
    font-family: inherit;
    color: transparent;
    background: linear-gradient(160deg, #f7931a 0%, #ff6600 50%, #f7931a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    opacity: 0.6;
    filter: blur(3px);
    animation: glow-pulse 3s ease-in-out infinite;
  }

  /* DNA Helix overlay */
  .dna-helix {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 60px;
    height: 160px;
    pointer-events: none;
  }

  .dna-strand {
    position: absolute;
    width: 100%;
    height: 100%;
  }

  .dna-node {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #f7931a;
    box-shadow: 0 0 12px #f7931a, 0 0 24px rgba(247,147,26,0.4);
  }

  .dna-node.cyan {
    background: #00c8ff;
    box-shadow: 0 0 12px #00c8ff, 0 0 24px rgba(0,200,255,0.4);
  }

  .dna-bar {
    position: absolute;
    height: 2px;
    background: linear-gradient(90deg, #f7931a, #00c8ff);
    opacity: 0.5;
    border-radius: 1px;
  }

  /* Animated cable lines */
  .cable {
    position: absolute;
    height: 2px;
    background: linear-gradient(90deg, transparent, #00c8ff, transparent);
    opacity: 0.3;
    animation: cable-flow 4s linear infinite;
  }
  .cable-1 { top: 40%; left: -100px; width: 200px; transform: rotate(-5deg); animation-delay: 0s; }
  .cable-2 { top: 60%; right: -100px; width: 180px; transform: rotate(3deg); animation-delay: 1s; }
  .cable-3 { bottom: 20%; left: -80px; width: 160px; transform: rotate(-8deg); animation-delay: 2s; }
  .cable-4 { top: 30%; right: -120px; width: 220px; transform: rotate(6deg); animation-delay: 0.5s; }
  .cable-5 { bottom: 35%; left: -60px; width: 140px; transform: rotate(2deg); animation-delay: 1.5s; }

  /* Platform base */
  .platform {
    position: absolute;
    bottom: -20px;
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    height: 12px;
    background: linear-gradient(180deg, #2a2a3a, #1a1a2a);
    border-radius: 6px;
    box-shadow:
      0 2px 20px rgba(247,147,26,0.2),
      inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .platform::before {
    content: '';
    position: absolute;
    top: 2px;
    left: 10%;
    width: 80%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #00c8ff, transparent);
    border-radius: 1px;
    animation: scan-line 3s ease-in-out infinite;
  }

  /* Text */
  .logo-text {
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: #e0e0e8;
    text-shadow: 0 0 20px rgba(247,147,26,0.2);
    position: relative;
  }
  .logo-text span {
    color: #f7931a;
    font-weight: 600;
    text-shadow: 0 0 20px rgba(247,147,26,0.5);
  }
  .logo-domain {
    font-size: 14px;
    letter-spacing: 4px;
    color: #64748b;
    margin-top: -5px;
  }

  /* Versions row */
  .versions {
    display: flex;
    gap: 60px;
    margin-top: 80px;
    z-index: 1;
  }
  .version {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .version-label {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #64748b;
  }

  /* Icon-only version (for favicon / app icon) */
  .logo-icon {
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a1a2e 0%, #0d0d1a 100%);
    border: 1px solid rgba(247,147,26,0.3);
    border-radius: 16px;
    position: relative;
    overflow: hidden;
  }
  .logo-icon::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(247,147,26,0.1) 0%, transparent 70%);
  }
  .logo-icon .b {
    font-size: 48px;
    font-weight: 900;
    font-family: 'Arial Black', sans-serif;
    color: transparent;
    background: linear-gradient(160deg, #f7931a 0%, #ff8c00 50%, #f7931a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    filter: drop-shadow(0 0 8px rgba(247,147,26,0.5));
  }

  /* Header version */
  .logo-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 24px;
    background: rgba(10,10,18,0.9);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 12px;
  }
  .logo-header .b-small {
    font-size: 28px;
    font-weight: 900;
    font-family: 'Arial Black', sans-serif;
    color: transparent;
    background: linear-gradient(160deg, #f7931a 0%, #ff8c00 100%);
    -webkit-background-clip: text;
    background-clip: text;
    filter: drop-shadow(0 0 6px rgba(247,147,26,0.4));
    line-height: 1;
  }
  .logo-header .text {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #e8e8f0, #f7931a);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* Banner version */
  .logo-banner {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 30px 50px;
    background: linear-gradient(135deg, #0d0d1a, #1a1a2e, #0d0d1a);
    border: 1px solid rgba(247,147,26,0.15);
    border-radius: 16px;
    position: relative;
    overflow: hidden;
  }
  .logo-banner::before {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #f7931a, #00c8ff, transparent);
    animation: scan-line 4s ease-in-out infinite;
  }
  .logo-banner .b-large {
    font-size: 64px;
    font-weight: 900;
    font-family: 'Arial Black', sans-serif;
    color: transparent;
    background: linear-gradient(160deg, #e8e8f0 0%, #8a8a9a 30%, #c0c0cc 60%, #f7931a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    filter: drop-shadow(0 0 15px rgba(247,147,26,0.4));
    line-height: 1;
  }
  .logo-banner .text-group {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .logo-banner .title {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #e8e8f0, #f7931a);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .logo-banner .subtitle {
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #00c8ff;
    opacity: 0.7;
  }

  @keyframes glow-pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.7; }
  }
  @keyframes cable-flow {
    0% { opacity: 0; transform: translateX(-20px) rotate(inherit); }
    50% { opacity: 0.4; }
    100% { opacity: 0; transform: translateX(20px) rotate(inherit); }
  }
  @keyframes scan-line {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="bg-circuits"></div>

  <!-- Main 3D-style Logo -->
  <div class="logo-container">
    <div style="position: relative; display: inline-block;">
      <div class="logo-b">₿</div>
      <!-- DNA nodes -->
      <div class="dna-helix">
        <div class="dna-node" style="top: 5%; left: 10%;"></div>
        <div class="dna-node cyan" style="top: 5%; right: 10%;"></div>
        <div class="dna-bar" style="top: 7%; left: 15%; width: 70%;"></div>
        <div class="dna-node" style="top: 20%; left: 0%;"></div>
        <div class="dna-node cyan" style="top: 20%; right: 0%;"></div>
        <div class="dna-bar" style="top: 22%; left: 5%; width: 90%;"></div>
        <div class="dna-node" style="top: 35%; left: 10%;"></div>
        <div class="dna-node cyan" style="top: 35%; right: 10%;"></div>
        <div class="dna-bar" style="top: 37%; left: 15%; width: 70%;"></div>
        <div class="dna-node" style="top: 50%; left: 5%;"></div>
        <div class="dna-node cyan" style="top: 50%; right: 5%;"></div>
        <div class="dna-bar" style="top: 52%; left: 10%; width: 80%;"></div>
        <div class="dna-node" style="top: 65%; left: 10%;"></div>
        <div class="dna-node cyan" style="top: 65%; right: 10%;"></div>
        <div class="dna-bar" style="top: 67%; left: 15%; width: 70%;"></div>
        <div class="dna-node" style="top: 80%; left: 0%;"></div>
        <div class="dna-node cyan" style="top: 80%; right: 0%;"></div>
        <div class="dna-bar" style="top: 82%; left: 5%; width: 90%;"></div>
        <div class="dna-node" style="top: 95%; left: 10%;"></div>
        <div class="dna-node cyan" style="top: 95%; right: 10%;"></div>
        <div class="dna-bar" style="top: 97%; left: 15%; width: 70%;"></div>
      </div>
      <!-- Cables -->
      <div class="cable cable-1"></div>
      <div class="cable cable-2"></div>
      <div class="cable cable-3"></div>
      <div class="cable cable-4"></div>
      <div class="cable cable-5"></div>
      <!-- Base platform -->
      <div class="platform"></div>
    </div>

    <div class="logo-text">
      <span>Block</span>Genomics
    </div>
    <div class="logo-domain">blockgenomics.io</div>
  </div>

  <!-- Usage Variations -->
  <div class="versions">
    <!-- App Icon -->
    <div class="version">
      <div class="logo-icon">
        <span class="b">₿</span>
      </div>
      <span class="version-label">App Icon</span>
    </div>

    <!-- Header -->
    <div class="version">
      <div class="logo-header">
        <span class="b-small">₿</span>
        <span class="text">Block Genomics</span>
      </div>
      <span class="version-label">Header</span>
    </div>

    <!-- Banner -->
    <div class="version">
      <div class="logo-banner">
        <span class="b-large">₿</span>
        <div class="text-group">
          <span class="title">Block Genomics</span>
          <span class="subtitle">Bitcoin DNA for Verified AI</span>
        </div>
      </div>
      <span class="version-label">Banner</span>
    </div>
  </div>
</body>
</html>
