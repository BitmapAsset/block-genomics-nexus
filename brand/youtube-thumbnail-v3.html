<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px;
    height: 720px;
    background: #030308;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    position: relative;
  }
  
  /* Split layout — left text, right neon city */
  .left-panel {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 55%;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px 50px;
    background: linear-gradient(135deg, #0a0020 0%, #1a0a3a 40%, transparent 100%);
  }
  
  .right-panel {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 55%;
    z-index: 5;
    overflow: hidden;
  }
  
  /* Neon city grid (bitmap block from above) */
  .neon-city {
    position: absolute;
    inset: -20px;
    display: grid;
    grid-template-columns: repeat(20, 1fr);
    grid-template-rows: repeat(12, 1fr);
    gap: 3px;
    transform: perspective(800px) rotateX(15deg) rotateY(-8deg) rotateZ(2deg);
    transform-origin: center center;
    opacity: 0.9;
  }
  
  .block-cell {
    border-radius: 2px;
    box-shadow: 0 0 8px var(--glow), inset 0 0 4px var(--glow);
  }
  
  /* Gradient overlay to fade city into left panel */
  .city-fade {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, #0a0020 0%, rgba(10,0,32,0.8) 20%, transparent 50%);
    z-index: 6;
  }
  
  .city-fade-top {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(10,0,32,0.5) 0%, transparent 30%, transparent 70%, rgba(10,0,32,0.5) 100%);
    z-index: 6;
  }
  
  /* Emojis */
  .emoji-row {
    font-size: 56px;
    margin-bottom: 12px;
    filter: drop-shadow(0 4px 15px rgba(0,0,0,0.5));
    letter-spacing: 8px;
  }
  
  /* Main text — MASSIVE and readable */
  .main-text {
    line-height: 1.05;
  }
  
  .line1 {
    font-size: 78px;
    font-weight: 900;
    letter-spacing: -2px;
    color: #00ffcc;
    text-shadow: 
      0 0 30px rgba(0,255,204,0.6),
      0 0 60px rgba(0,255,204,0.3),
      0 4px 0 rgba(0,0,0,0.9);
    -webkit-text-stroke: 2px rgba(0,255,204,0.8);
  }
  
  .line2 {
    font-size: 82px;
    font-weight: 900;
    letter-spacing: -2px;
    margin-top: 4px;
    text-shadow: 0 4px 0 rgba(0,0,0,0.9), 0 0 20px rgba(247,147,26,0.4);
  }
  
  .line2 .white {
    color: #ffffff;
    -webkit-text-stroke: 1.5px rgba(255,255,255,0.3);
  }
  
  .line2 .orange {
    background: linear-gradient(180deg, #ffd700 0%, #f7931a 50%, #e06000 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 3px 0 rgba(0,0,0,0.9));
    -webkit-text-stroke: 0;
  }
  
  .line3 {
    font-size: 78px;
    font-weight: 900;
    letter-spacing: -1px;
    margin-top: 4px;
    background: linear-gradient(180deg, #ffd700 0%, #f7931a 50%, #e06000 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 3px 0 rgba(0,0,0,0.9));
    text-shadow: none;
  }
  
  /* Subtitle */
  .subtitle {
    font-size: 26px;
    font-weight: 700;
    color: rgba(255,255,255,0.8);
    margin-top: 18px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
  }
  
  .subtitle .highlight {
    color: #f7931a;
    font-weight: 900;
  }
  
  /* Bottom bar */
  .bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: rgba(0,0,0,0.85);
    border-top: 3px solid #f7931a;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    z-index: 20;
  }
  
  .stat {
    font-size: 20px;
    font-weight: 800;
    color: white;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .stat .val { color: #f7931a; }
  
  /* LIVE badge */
  .live-badge {
    position: absolute;
    top: 20px;
    right: 25px;
    background: linear-gradient(135deg, #ff0000, #cc0000);
    color: white;
    font-size: 20px;
    font-weight: 900;
    padding: 8px 18px;
    border-radius: 8px;
    letter-spacing: 3px;
    box-shadow: 0 0 20px rgba(255,0,0,0.5), 0 4px 15px rgba(0,0,0,0.5);
    z-index: 20;
  }
  
  /* Brand */
  .brand {
    position: absolute;
    top: 22px;
    left: 30px;
    font-size: 20px;
    font-weight: 800;
    z-index: 20;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.5);
  }
</style>
</head>
<body>
  <div class="brand">BLOCKGENOMICS.IO</div>
  <div class="live-badge">🔴 LIVE</div>
  
  <!-- LEFT: Text -->
  <div class="left-panel">
    <div class="emoji-row">🤖 ⚡ 🦞 🧬</div>
    <div class="main-text">
      <div class="line1">AI AGENTS</div>
      <div class="line2"><span class="white">FOR YOUR</span></div>
      <div class="line3">BITCOIN LAND!</div>
    </div>
    <div class="subtitle">
      Every Block Has a Guardian 🛡️ <span class="highlight">937K+ Blocks</span>
    </div>
  </div>
  
  <!-- RIGHT: Neon bitmap city from above -->
  <div class="right-panel">
    <div class="neon-city" id="city"></div>
  </div>
  <div class="city-fade"></div>
  <div class="city-fade-top"></div>
  
  <!-- Bottom stats -->
  <div class="bottom-bar">
    <div class="stat">🧬 <span class="val">Bitcoin DNA</span></div>
    <div class="stat">⚡ <span class="val">Lightning</span></div>
    <div class="stat">🗺️ <span class="val">The Nexus</span></div>
    <div class="stat">🤖 <span class="val">Guardians</span></div>
  </div>

  <script>
    // Generate neon city grid (bitmap block from above view)
    const city = document.getElementById('city');
    const neonColors = [
      { bg: '#f7931a', glow: 'rgba(247,147,26,0.6)' },
      { bg: '#ff7e00', glow: 'rgba(255,126,0,0.5)' },
      { bg: '#ffb347', glow: 'rgba(255,179,71,0.4)' },
      { bg: '#e06000', glow: 'rgba(224,96,0,0.5)' },
      { bg: '#00ffcc', glow: 'rgba(0,255,204,0.5)' },
      { bg: '#a855f7', glow: 'rgba(168,85,247,0.4)' },
      { bg: '#ff3366', glow: 'rgba(255,51,102,0.4)' },
      { bg: '#00ccff', glow: 'rgba(0,204,255,0.4)' },
    ];
    
    // Create ~240 cells with varying sizes (bitmap Mondrian look)
    const cells = [];
    for (let r = 0; r < 12; r++) {
      for (let c = 0; c < 20; c++) {
        const rand = Math.random();
        // Some cells are "buildings" (bright), some are "roads" (dark)
        if (rand < 0.15) {
          // Road / gap — dark
          cells.push({ r, c, dark: true });
        } else {
          const colorIdx = Math.floor(Math.random() * neonColors.length);
          const brightness = 0.4 + Math.random() * 0.6;
          cells.push({ r, c, color: neonColors[colorIdx], brightness, dark: false });
        }
      }
    }
    
    cells.forEach(cell => {
      const div = document.createElement('div');
      div.className = 'block-cell';
      if (cell.dark) {
        div.style.background = '#080818';
        div.style.setProperty('--glow', 'transparent');
      } else {
        div.style.background = cell.color.bg;
        div.style.opacity = cell.brightness;
        div.style.setProperty('--glow', cell.color.glow);
      }
      div.style.gridRow = cell.r + 1;
      div.style.gridColumn = cell.c + 1;
      city.appendChild(div);
    });
  </script>
</body>
</html>
