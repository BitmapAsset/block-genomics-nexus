<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Block Genomics — Shield Badge V2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a14; color: #fff; font-family: -apple-system, 'Helvetica Neue', sans-serif; padding: 40px; }
  h1 { text-align: center; font-size: 26px; margin-bottom: 8px; color: #f7931a; }
  .subtitle { text-align: center; color: #888; margin-bottom: 50px; font-size: 13px; }
  .design-group { text-align: center; margin-bottom: 55px; }
  .design-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .design-desc { color: #666; font-size: 12px; margin-bottom: 22px; }
  .tier-row { display: flex; gap: 40px; justify-content: center; margin-bottom: 12px; }
  .tier-item { text-align: center; }
  .tier-label { font-size: 11px; margin-top: 6px; }
  .tier-name { font-size: 9px; color: #555; }
  .section-divider { border: none; border-top: 1px solid #1a1a2e; margin: 15px auto 45px; width: 70%; }
  .handle-row { display: flex; gap: 15px; justify-content: center; margin-top: 15px; flex-wrap: wrap; }
  .handle-chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: #111; border: 1px solid #222; border-radius: 10px;
    padding: 7px 14px; font-size: 13px;
  }
  .handle-chip .name { font-weight: 600; }
  .handle-chip .at { color: #777; font-size: 11px; }
</style>
</head>
<body>

<h1>🛡️ Shield Badge — 4 Variations</h1>
<p class="subtitle">All shields, different personalities. Pick your champion.</p>

<div id="badges"></div>

<script>
const TIERS = {
  1: { name: 'Tier 1 — Block Owner', color: '#f7931a', accent: '#ffd27d', dark: '#3d2200', glow: 'rgba(247,147,26,', label: 'GOLD' },
  2: { name: 'Tier 2 — Parcel Owner', color: '#66ccff', accent: '#a8e0ff', dark: '#002244', glow: 'rgba(102,204,255,', label: 'CYAN' },
  3: { name: 'Tier 3 — Delegated', color: '#a855f7', accent: '#d4a8ff', dark: '#1a0033', glow: 'rgba(168,85,247,', label: 'PURPLE' },
};

// Shared shield path
function shieldPath(ctx, cx, cy, s, style) {
  ctx.beginPath();
  if (style === 'pointed') {
    // More pointed bottom, wider shoulders
    ctx.moveTo(cx, cy - 40*s);
    ctx.bezierCurveTo(cx + 15*s, cy - 40*s, cx + 36*s, cy - 36*s, cx + 38*s, cy - 28*s);
    ctx.lineTo(cx + 38*s, cy - 5*s);
    ctx.bezierCurveTo(cx + 36*s, cy + 14*s, cx + 22*s, cy + 30*s, cx, cy + 44*s);
    ctx.bezierCurveTo(cx - 22*s, cy + 30*s, cx - 36*s, cy + 14*s, cx - 38*s, cy - 5*s);
    ctx.lineTo(cx - 38*s, cy - 28*s);
    ctx.bezierCurveTo(cx - 36*s, cy - 36*s, cx - 15*s, cy - 40*s, cx, cy - 40*s);
  } else if (style === 'rounded') {
    // Softer, more rounded
    ctx.moveTo(cx, cy - 36*s);
    ctx.bezierCurveTo(cx + 18*s, cy - 36*s, cx + 32*s, cy - 32*s, cx + 34*s, cy - 24*s);
    ctx.lineTo(cx + 34*s, cy + 2*s);
    ctx.bezierCurveTo(cx + 32*s, cy + 18*s, cx + 20*s, cy + 32*s, cx, cy + 40*s);
    ctx.bezierCurveTo(cx - 20*s, cy + 32*s, cx - 32*s, cy + 18*s, cx - 34*s, cy + 2*s);
    ctx.lineTo(cx - 34*s, cy - 24*s);
    ctx.bezierCurveTo(cx - 32*s, cy - 32*s, cx - 18*s, cy - 36*s, cx, cy - 36*s);
  } else if (style === 'angular') {
    // More angular/geometric
    ctx.moveTo(cx, cy - 38*s);
    ctx.lineTo(cx + 36*s, cy - 28*s);
    ctx.lineTo(cx + 36*s, cy + 2*s);
    ctx.lineTo(cx, cy + 42*s);
    ctx.lineTo(cx - 36*s, cy + 2*s);
    ctx.lineTo(cx - 36*s, cy - 28*s);
    ctx.closePath();
    return;
  } else {
    // Classic
    ctx.moveTo(cx, cy - 38*s);
    ctx.bezierCurveTo(cx + 12*s, cy - 38*s, cx + 34*s, cy - 34*s, cx + 35*s, cy - 28*s);
    ctx.lineTo(cx + 35*s, cy - 2*s);
    ctx.bezierCurveTo(cx + 34*s, cy + 16*s, cx + 24*s, cy + 28*s, cx, cy + 42*s);
    ctx.bezierCurveTo(cx - 24*s, cy + 28*s, cx - 34*s, cy + 16*s, cx - 35*s, cy - 2*s);
    ctx.lineTo(cx - 35*s, cy - 28*s);
    ctx.bezierCurveTo(cx - 34*s, cy - 34*s, cx - 12*s, cy - 38*s, cx, cy - 38*s);
  }
  ctx.closePath();
}

function drawA1(ctx, size, tier) {
  // A1: Fortress Shield — double border, horizontal divider, ₿ top, check bottom
  const cx = size/2, cy = size/2, s = size/100;
  
  // Glow
  const glow = ctx.createRadialGradient(cx, cy, size*0.15, cx, cy, size*0.5);
  glow.addColorStop(0, tier.glow + '0.3)');
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(cx, cy, size*0.5, 0, Math.PI*2); ctx.fill();
  
  // Outer shield
  shieldPath(ctx, cx, cy, s, 'pointed');
  const fill = ctx.createLinearGradient(cx, cy - 40*s, cx, cy + 44*s);
  fill.addColorStop(0, '#1c1c34');
  fill.addColorStop(0.5, '#0f0f1e');
  fill.addColorStop(1, '#080812');
  ctx.fillStyle = fill;
  ctx.fill();
  
  // Outer border - gradient
  shieldPath(ctx, cx, cy, s, 'pointed');
  const border = ctx.createLinearGradient(cx, cy - 40*s, cx, cy + 44*s);
  border.addColorStop(0, tier.accent);
  border.addColorStop(0.5, tier.color);
  border.addColorStop(1, tier.accent);
  ctx.strokeStyle = border;
  ctx.lineWidth = 2.5*s;
  ctx.stroke();
  
  // Inner shield border (smaller)
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(0.88, 0.88);
  ctx.translate(-cx, -cy);
  shieldPath(ctx, cx, cy, s, 'pointed');
  ctx.strokeStyle = tier.color + '44';
  ctx.lineWidth = 1*s;
  ctx.stroke();
  ctx.restore();
  
  // Horizontal divider line
  ctx.beginPath();
  ctx.moveTo(cx - 24*s, cy + 4*s);
  ctx.lineTo(cx + 24*s, cy + 4*s);
  ctx.strokeStyle = tier.color + '33';
  ctx.lineWidth = 1*s;
  ctx.stroke();
  
  // ₿ top half
  ctx.font = `bold ${28*s}px -apple-system, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const btcGrad = ctx.createLinearGradient(cx, cy - 20*s, cx, cy + 5*s);
  btcGrad.addColorStop(0, tier.accent);
  btcGrad.addColorStop(0.5, '#ffffff');
  btcGrad.addColorStop(1, tier.color);
  ctx.fillStyle = btcGrad;
  ctx.fillText('₿', cx, cy - 12*s);
  
  // Verified check bottom half
  ctx.beginPath();
  ctx.moveTo(cx - 8*s, cy + 20*s);
  ctx.lineTo(cx - 2*s, cy + 26*s);
  ctx.lineTo(cx + 10*s, cy + 14*s);
  ctx.strokeStyle = '#22ff88';
  ctx.lineWidth = 2.5*s;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
  
  // Corner diamonds
  const diamonds = [
    [cx - 28*s, cy - 20*s], [cx + 28*s, cy - 20*s]
  ];
  diamonds.forEach(([dx, dy]) => {
    ctx.beginPath();
    ctx.moveTo(dx, dy - 4*s);
    ctx.lineTo(dx + 3*s, dy);
    ctx.lineTo(dx, dy + 4*s);
    ctx.lineTo(dx - 3*s, dy);
    ctx.closePath();
    ctx.fillStyle = tier.color + '66';
    ctx.fill();
  });
}

function drawA2(ctx, size, tier) {
  // A2: Crown Shield — crown detail at top, ₿ center, elegant curves
  const cx = size/2, cy = size/2, s = size/100;
  
  // Glow
  const glow = ctx.createRadialGradient(cx, cy, size*0.15, cx, cy, size*0.5);
  glow.addColorStop(0, tier.glow + '0.25)');
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(cx, cy, size*0.5, 0, Math.PI*2); ctx.fill();
  
  // Shield body
  shieldPath(ctx, cx, cy + 4*s, s, 'rounded');
  const fill = ctx.createLinearGradient(cx, cy - 36*s, cx, cy + 44*s);
  fill.addColorStop(0, '#1a1a30');
  fill.addColorStop(1, '#08081a');
  ctx.fillStyle = fill;
  ctx.fill();
  
  // Border
  shieldPath(ctx, cx, cy + 4*s, s, 'rounded');
  const border = ctx.createLinearGradient(cx - 34*s, cy, cx + 34*s, cy);
  border.addColorStop(0, tier.color);
  border.addColorStop(0.3, tier.accent);
  border.addColorStop(0.7, tier.accent);
  border.addColorStop(1, tier.color);
  ctx.strokeStyle = border;
  ctx.lineWidth = 2.5*s;
  ctx.stroke();
  
  // Crown at top (3 points)
  ctx.beginPath();
  ctx.moveTo(cx - 16*s, cy - 28*s);
  ctx.lineTo(cx - 12*s, cy - 36*s);
  ctx.lineTo(cx - 4*s, cy - 30*s);
  ctx.lineTo(cx, cy - 38*s);
  ctx.lineTo(cx + 4*s, cy - 30*s);
  ctx.lineTo(cx + 12*s, cy - 36*s);
  ctx.lineTo(cx + 16*s, cy - 28*s);
  ctx.closePath();
  const crownGrad = ctx.createLinearGradient(cx, cy - 38*s, cx, cy - 28*s);
  crownGrad.addColorStop(0, tier.accent);
  crownGrad.addColorStop(1, tier.color);
  ctx.fillStyle = crownGrad;
  ctx.fill();
  
  // ₿ center
  ctx.font = `bold ${30*s}px -apple-system, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const btcGrad = ctx.createLinearGradient(cx, cy - 10*s, cx, cy + 15*s);
  btcGrad.addColorStop(0, tier.accent);
  btcGrad.addColorStop(0.4, '#ffffff');
  btcGrad.addColorStop(1, tier.color);
  ctx.fillStyle = btcGrad;
  ctx.fillText('₿', cx, cy + 2*s);
  
  // Subtle ₿ glow
  const btcGlow = ctx.createRadialGradient(cx, cy + 2*s, 0, cx, cy + 2*s, 18*s);
  btcGlow.addColorStop(0, tier.glow + '0.15)');
  btcGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = btcGlow;
  ctx.beginPath(); ctx.arc(cx, cy + 2*s, 18*s, 0, Math.PI*2); ctx.fill();
  
  // Check at bottom
  ctx.beginPath();
  ctx.moveTo(cx - 6*s, cy + 28*s);
  ctx.lineTo(cx - 1*s, cy + 33*s);
  ctx.lineTo(cx + 8*s, cy + 24*s);
  ctx.strokeStyle = '#22ff88';
  ctx.lineWidth = 2*s;
  ctx.lineCap = 'round';
  ctx.stroke();
}

function drawA3(ctx, size, tier) {
  // A3: Blade Shield — sharp angular geometric, no curves, modern/aggressive
  const cx = size/2, cy = size/2, s = size/100;
  
  // Glow
  const glow = ctx.createRadialGradient(cx, cy, size*0.1, cx, cy, size*0.5);
  glow.addColorStop(0, tier.glow + '0.3)');
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(cx, cy, size*0.5, 0, Math.PI*2); ctx.fill();
  
  // Angular shield
  shieldPath(ctx, cx, cy, s, 'angular');
  const fill = ctx.createLinearGradient(cx, cy - 38*s, cx, cy + 42*s);
  fill.addColorStop(0, '#1a1a2e');
  fill.addColorStop(0.3, '#111122');
  fill.addColorStop(1, '#080814');
  ctx.fillStyle = fill;
  ctx.fill();
  
  // Border
  shieldPath(ctx, cx, cy, s, 'angular');
  ctx.strokeStyle = tier.color;
  ctx.lineWidth = 2.5*s;
  ctx.stroke();
  
  // Inner angular shield
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(0.82, 0.82);
  ctx.translate(-cx, -cy);
  shieldPath(ctx, cx, cy, s, 'angular');
  ctx.strokeStyle = tier.color + '33';
  ctx.lineWidth = 1*s;
  ctx.stroke();
  ctx.restore();
  
  // Vertical line accent through center
  ctx.beginPath();
  ctx.moveTo(cx, cy - 28*s);
  ctx.lineTo(cx, cy + 30*s);
  ctx.strokeStyle = tier.color + '15';
  ctx.lineWidth = 1*s;
  ctx.stroke();
  
  // Cross lines
  ctx.beginPath();
  ctx.moveTo(cx - 22*s, cy - 8*s);
  ctx.lineTo(cx + 22*s, cy - 8*s);
  ctx.strokeStyle = tier.color + '20';
  ctx.lineWidth = 0.8*s;
  ctx.stroke();
  
  // ₿ bold center
  ctx.font = `bold ${30*s}px -apple-system, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.fillText('₿', cx, cy - 2*s);
  
  // Color accent bar at top
  ctx.beginPath();
  ctx.moveTo(cx - 20*s, cy - 30*s);
  ctx.lineTo(cx + 20*s, cy - 30*s);
  const barGrad = ctx.createLinearGradient(cx - 20*s, 0, cx + 20*s, 0);
  barGrad.addColorStop(0, 'transparent');
  barGrad.addColorStop(0.5, tier.color);
  barGrad.addColorStop(1, 'transparent');
  ctx.strokeStyle = barGrad;
  ctx.lineWidth = 2*s;
  ctx.stroke();
  
  // Check bottom right corner
  ctx.beginPath();
  ctx.moveTo(cx - 5*s, cy + 24*s);
  ctx.lineTo(cx, cy + 29*s);
  ctx.lineTo(cx + 8*s, cy + 20*s);
  ctx.strokeStyle = '#22ff88';
  ctx.lineWidth = 2*s;
  ctx.lineCap = 'round';
  ctx.stroke();
}

function drawA4(ctx, size, tier) {
  // A4: DNA Shield — shield with integrated double helix wrapping around ₿
  const cx = size/2, cy = size/2, s = size/100;
  
  // Glow
  const glow = ctx.createRadialGradient(cx, cy, size*0.15, cx, cy, size*0.5);
  glow.addColorStop(0, tier.glow + '0.25)');
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(cx, cy, size*0.5, 0, Math.PI*2); ctx.fill();
  
  // Shield
  shieldPath(ctx, cx, cy, s, 'classic');
  const fill = ctx.createLinearGradient(cx, cy - 38*s, cx, cy + 42*s);
  fill.addColorStop(0, '#161628');
  fill.addColorStop(1, '#0a0a16');
  ctx.fillStyle = fill;
  ctx.fill();
  
  // Gradient border
  shieldPath(ctx, cx, cy, s, 'classic');
  const border = ctx.createLinearGradient(cx, cy - 38*s, cx, cy + 42*s);
  border.addColorStop(0, tier.accent);
  border.addColorStop(0.5, tier.color);
  border.addColorStop(1, '#22ff88');
  ctx.strokeStyle = border;
  ctx.lineWidth = 2.5*s;
  ctx.stroke();
  
  // DNA double helix wrapping inside the shield
  ctx.save();
  shieldPath(ctx, cx, cy, s, 'classic');
  ctx.clip();
  
  const helixSteps = 30;
  const helixAmp = 14*s;
  const helixTop = cy - 32*s;
  const helixBot = cy + 36*s;
  
  for (let strand = 0; strand < 2; strand++) {
    const phase = strand * Math.PI;
    ctx.beginPath();
    for (let i = 0; i <= helixSteps; i++) {
      const t = i / helixSteps;
      const y = helixTop + t * (helixBot - helixTop);
      const x = cx + Math.sin(t * Math.PI * 3.5 + phase) * helixAmp;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = strand === 0 ? tier.color + '44' : tier.accent + '44';
    ctx.lineWidth = 2*s;
    ctx.stroke();
    
    // Nodes
    for (let i = 0; i <= helixSteps; i += 3) {
      const t = i / helixSteps;
      const y = helixTop + t * (helixBot - helixTop);
      const x = cx + Math.sin(t * Math.PI * 3.5 + phase) * helixAmp;
      ctx.beginPath();
      ctx.arc(x, y, 1.8*s, 0, Math.PI*2);
      ctx.fillStyle = strand === 0 ? tier.color + '55' : tier.accent + '55';
      ctx.fill();
    }
  }
  
  // Rungs
  for (let i = 0; i <= helixSteps; i += 4) {
    const t = i / helixSteps;
    const y = helixTop + t * (helixBot - helixTop);
    const x1 = cx + Math.sin(t * Math.PI * 3.5) * helixAmp;
    const x2 = cx + Math.sin(t * Math.PI * 3.5 + Math.PI) * helixAmp;
    ctx.beginPath();
    ctx.moveTo(x1, y);
    ctx.lineTo(x2, y);
    ctx.strokeStyle = '#ffffff15';
    ctx.lineWidth = 0.8*s;
    ctx.stroke();
  }
  ctx.restore();
  
  // ₿ symbol with dark backing circle for readability
  const btcR = 14*s;
  ctx.beginPath();
  ctx.arc(cx, cy, btcR, 0, Math.PI*2);
  ctx.fillStyle = '#0a0a16cc';
  ctx.fill();
  ctx.strokeStyle = tier.color + '44';
  ctx.lineWidth = 1*s;
  ctx.stroke();
  
  ctx.font = `bold ${22*s}px -apple-system, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const btcGrad = ctx.createLinearGradient(cx, cy - 11*s, cx, cy + 11*s);
  btcGrad.addColorStop(0, tier.accent);
  btcGrad.addColorStop(0.5, '#ffffff');
  btcGrad.addColorStop(1, tier.color);
  ctx.fillStyle = btcGrad;
  ctx.fillText('₿', cx, cy);
  
  // Check at very bottom
  ctx.beginPath();
  ctx.moveTo(cx - 5*s, cy + 30*s);
  ctx.lineTo(cx - 1*s, cy + 34*s);
  ctx.lineTo(cx + 7*s, cy + 26*s);
  ctx.strokeStyle = '#22ff88';
  ctx.lineWidth = 2*s;
  ctx.lineCap = 'round';
  ctx.stroke();
}

const designs = [
  { name: 'A1: Fortress Shield', desc: 'Double border, horizontal divider, ₿ above / ✓ below. Military precision.', fn: drawA1 },
  { name: 'A2: Crown Shield', desc: 'Golden crown detail at top, rounded curves. Royal, prestigious.', fn: drawA2 },
  { name: 'A3: Blade Shield', desc: 'Sharp angular geometry, no curves. Modern, aggressive, clean.', fn: drawA3 },
  { name: 'A4: DNA Shield', desc: 'Double helix woven through the shield behind ₿. Our signature — identity + security.', fn: drawA4 },
];

const container = document.getElementById('badges');

designs.forEach((design, di) => {
  const group = document.createElement('div');
  group.className = 'design-group';
  
  const title = document.createElement('div');
  title.className = 'design-title';
  title.textContent = design.name;
  group.appendChild(title);
  
  const desc = document.createElement('div');
  desc.className = 'design-desc';
  desc.textContent = design.desc;
  group.appendChild(desc);
  
  // Large badges
  const tierRow = document.createElement('div');
  tierRow.className = 'tier-row';
  
  [1, 2, 3].forEach(t => {
    const item = document.createElement('div');
    item.className = 'tier-item';
    
    const canvas = document.createElement('canvas');
    const sz = 160;
    canvas.width = sz; canvas.height = sz;
    canvas.style.width = sz + 'px'; canvas.style.height = sz + 'px';
    const ctx = canvas.getContext('2d');
    design.fn(ctx, sz, TIERS[t]);
    item.appendChild(canvas);
    
    const label = document.createElement('div');
    label.className = 'tier-label';
    label.innerHTML = `<strong style="color:${TIERS[t].color}">${TIERS[t].label}</strong>`;
    item.appendChild(label);
    
    const name = document.createElement('div');
    name.className = 'tier-name';
    name.textContent = TIERS[t].name;
    item.appendChild(name);
    
    tierRow.appendChild(item);
  });
  group.appendChild(tierRow);
  
  // Handle previews
  const handleRow = document.createElement('div');
  handleRow.className = 'handle-row';
  [1, 2, 3].forEach(t => {
    const chip = document.createElement('div');
    chip.className = 'handle-chip';
    
    const mini = document.createElement('canvas');
    const ms = 24;
    mini.width = ms; mini.height = ms;
    mini.style.width = ms + 'px'; mini.style.height = ms + 'px';
    design.fn(mini.getContext('2d'), ms, TIERS[t]);
    chip.appendChild(mini);
    chip.innerHTML += `<span class="name">Gravity</span><span class="at">@gravity</span>`;
    handleRow.appendChild(chip);
  });
  group.appendChild(handleRow);
  
  container.appendChild(group);
  
  if (di < designs.length - 1) {
    const hr = document.createElement('hr');
    hr.className = 'section-divider';
    container.appendChild(hr);
  }
});
</script>
</body>
</html>
