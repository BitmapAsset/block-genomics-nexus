<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Genomics — Two-Tier AI Ownership</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'SF Pro Display', -apple-system, system-ui, sans-serif;
    overflow: hidden;
  }
  
  .container {
    position: relative;
    width: 1200px;
    height: 1200px;
  }

  /* Center: Bitcoin/Bitmap Owner */
  .center-core {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 200px; height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, #f7931a 0%, #c76b00 70%, #8B4513 100%);
    box-shadow: 0 0 60px rgba(247,147,26,0.6), 0 0 120px rgba(247,147,26,0.3), inset 0 0 30px rgba(255,200,100,0.3);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 30;
    animation: corePulse 3s ease-in-out infinite;
  }
  .center-core .icon { font-size: 48px; margin-bottom: 4px; }
  .center-core .label { color: #fff; font-size: 16px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
  .center-core .sublabel { color: rgba(255,255,255,0.7); font-size: 11px; font-weight: 500; margin-top: 2px; }

  @keyframes corePulse {
    0%, 100% { box-shadow: 0 0 60px rgba(247,147,26,0.6), 0 0 120px rgba(247,147,26,0.3); }
    50% { box-shadow: 0 0 80px rgba(247,147,26,0.8), 0 0 160px rgba(247,147,26,0.4); }
  }

  /* OpenClaw Ring */
  .openclaw-ring {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 420px; height: 420px;
    border-radius: 50%;
    border: 3px solid rgba(102,204,255,0.4);
    box-shadow: 0 0 30px rgba(102,204,255,0.15), inset 0 0 30px rgba(102,204,255,0.08);
    z-index: 20;
    animation: ringRotate 60s linear infinite;
  }
  
  @keyframes ringRotate {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to { transform: translate(-50%, -50%) rotate(360deg); }
  }

  /* OpenClaw badge on ring */
  .openclaw-badge {
    position: absolute;
    width: 100px; height: 100px;
    border-radius: 50%;
    background: radial-gradient(circle, #1a3a5c 0%, #0d1b2a 100%);
    border: 2px solid rgba(102,204,255,0.6);
    box-shadow: 0 0 20px rgba(102,204,255,0.3);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 25;
    animation: ringRotateReverse 60s linear infinite;
  }
  
  @keyframes ringRotateReverse {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to { transform: translate(-50%, -50%) rotate(-360deg); }
  }
  
  .openclaw-badge .icon { font-size: 28px; }
  .openclaw-badge .label { color: #66ccff; font-size: 8px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }

  /* Connection lines from center to OpenClaw ring */
  .inner-connection {
    position: absolute;
    left: 50%; top: 50%;
    transform-origin: 0 0;
    height: 2px;
    background: linear-gradient(90deg, rgba(247,147,26,0.8) 0%, rgba(102,204,255,0.6) 100%);
    z-index: 15;
    box-shadow: 0 0 8px rgba(102,204,255,0.3);
  }

  /* Guardian nodes */
  .guardian-node {
    position: absolute;
    width: 110px; height: 110px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .guardian-node:hover {
    transform: translate(-50%, -50%) scale(1.1) !important;
  }
  .guardian-node .icon { font-size: 24px; margin-bottom: 2px; }
  .guardian-node .label { color: #fff; font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; text-align: center; line-height: 1.2; }
  .guardian-node .sublabel { color: rgba(255,255,255,0.5); font-size: 7px; margin-top: 1px; text-align: center; }

  /* Guardian tiers */
  .guardian-gold {
    background: radial-gradient(circle, #2a1f0a 0%, #1a1200 100%);
    border: 2px solid rgba(247,147,26,0.5);
    box-shadow: 0 0 20px rgba(247,147,26,0.2);
  }
  .guardian-cyan {
    background: radial-gradient(circle, #0a1f2a 0%, #001218 100%);
    border: 2px solid rgba(102,204,255,0.5);
    box-shadow: 0 0 20px rgba(102,204,255,0.2);
  }
  .guardian-purple {
    background: radial-gradient(circle, #1a0a2a 0%, #0d0018 100%);
    border: 2px solid rgba(168,85,247,0.5);
    box-shadow: 0 0 20px rgba(168,85,247,0.2);
  }

  /* Branch lines from OpenClaw to Guardians */
  .branch-line {
    position: absolute;
    left: 50%; top: 50%;
    transform-origin: 0 0;
    height: 2px;
    z-index: 5;
  }
  .branch-gold { background: linear-gradient(90deg, rgba(102,204,255,0.4) 0%, rgba(247,147,26,0.6) 100%); box-shadow: 0 0 6px rgba(247,147,26,0.2); }
  .branch-cyan { background: linear-gradient(90deg, rgba(102,204,255,0.4) 0%, rgba(102,204,255,0.6) 100%); box-shadow: 0 0 6px rgba(102,204,255,0.2); }
  .branch-purple { background: linear-gradient(90deg, rgba(102,204,255,0.4) 0%, rgba(168,85,247,0.6) 100%); box-shadow: 0 0 6px rgba(168,85,247,0.2); }

  /* Data flow particles on branches */
  .particle-flow {
    position: absolute;
    width: 4px; height: 4px;
    border-radius: 50%;
    animation: flowParticle 3s linear infinite;
    z-index: 6;
  }
  @keyframes flowParticle {
    0% { left: 0%; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { left: 100%; opacity: 0; }
  }

  /* Title */
  .title {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 100;
  }
  .title h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 4px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #f7931a 0%, #66ccff 50%, #a855f7 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .title p {
    color: rgba(255,255,255,0.4);
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* Legend */
  .legend {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 30px;
    z-index: 100;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .legend-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
  }
  .legend-dot.gold { background: #f7931a; box-shadow: 0 0 8px rgba(247,147,26,0.5); }
  .legend-dot.cyan { background: #66ccff; box-shadow: 0 0 8px rgba(102,204,255,0.5); }
  .legend-dot.purple { background: #a855f7; box-shadow: 0 0 8px rgba(168,85,247,0.5); }
  .legend-label { color: rgba(255,255,255,0.5); font-size: 11px; letter-spacing: 1px; }

  /* Ambient particles */
  .ambient {
    position: fixed;
    width: 2px; height: 2px;
    border-radius: 50%;
    background: rgba(247,147,26,0.3);
    animation: float 8s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) translateX(0); opacity: 0.2; }
    50% { transform: translateY(-30px) translateX(10px); opacity: 0.6; }
  }

  /* Label ring */
  .ring-label {
    position: absolute;
    left: 50%; top: 50%;
    color: rgba(102,204,255,0.5);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    white-space: nowrap;
    z-index: 21;
  }

  /* Outer ring label */
  .outer-label {
    position: absolute;
    color: rgba(255,255,255,0.2);
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    z-index: 3;
  }
</style>
</head>
<body>

<div class="title">
  <h1>Block Genomics</h1>
  <p>Two-Tier AI Ownership Architecture</p>
</div>

<div class="container" id="diagram">
  <!-- Center: Owner / Bitmap -->
  <div class="center-core">
    <div class="icon">₿</div>
    <div class="label">BITMAP</div>
    <div class="sublabel">Block Owner</div>
    <div class="sublabel" style="font-size:9px; opacity:0.5;">Sovereign Identity</div>
  </div>

  <!-- OpenClaw Ring -->
  <div class="openclaw-ring" id="oclawRing"></div>

  <!-- Ring labels -->
  <div class="ring-label" style="transform: translate(-50%, -50%) translateY(-230px);">OpenClaw Manager Ring</div>
</div>

<div class="legend">
  <div class="legend-item">
    <div class="legend-dot gold"></div>
    <span class="legend-label">Tier 1 — Block Guardian</span>
  </div>
  <div class="legend-item">
    <div class="legend-dot cyan"></div>
    <span class="legend-label">Tier 2 — Parcel Guardian</span>
  </div>
  <div class="legend-item">
    <div class="legend-dot purple"></div>
    <span class="legend-label">Tier 3 — Delegated Agent</span>
  </div>
</div>

<script>
const container = document.getElementById('diagram');
const cx = 600, cy = 600;
const oclawRadius = 210;
const guardianRadius = 480;

// Guardian agents around the outer ring
const guardians = [
  { name: 'SENTINEL', sub: 'Block #720143', tier: 'gold', icon: '🛡️' },
  { name: 'ATLAS', sub: 'Block #433445', tier: 'gold', icon: '🗺️' },
  { name: 'NEXUS-1', sub: 'Block #100000', tier: 'gold', icon: '⚡' },
  { name: 'ORACLE', sub: 'Parcel #847', tier: 'cyan', icon: '🔮' },
  { name: 'MERCHANT', sub: 'Parcel #1203', tier: 'cyan', icon: '🏪' },
  { name: 'BUILDER', sub: 'Parcel #562', tier: 'cyan', icon: '🏗️' },
  { name: 'SCOUT', sub: 'Parcel #94', tier: 'cyan', icon: '🔭' },
  { name: 'DELEGATE-A', sub: 'Delegated', tier: 'purple', icon: '👤' },
  { name: 'DELEGATE-B', sub: 'Delegated', tier: 'purple', icon: '🤖' },
  { name: 'DELEGATE-C', sub: 'Delegated', tier: 'purple', icon: '🎮' },
  { name: 'MINER', sub: 'Block #210000', tier: 'gold', icon: '⛏️' },
  { name: 'KEEPER', sub: 'Parcel #330', tier: 'cyan', icon: '🔑' },
];

const oclawCount = 4;

// Draw OpenClaw badges on the ring
for (let i = 0; i < oclawCount; i++) {
  const angle = (i / oclawCount) * Math.PI * 2 - Math.PI / 2;
  const x = cx + Math.cos(angle) * oclawRadius;
  const y = cy + Math.sin(angle) * oclawRadius;

  const badge = document.createElement('div');
  badge.className = 'openclaw-badge';
  badge.style.left = x + 'px';
  badge.style.top = y + 'px';
  badge.style.transform = 'translate(-50%, -50%)';
  badge.innerHTML = `<div class="icon">🐾</div><div class="label">OpenClaw</div>`;
  container.appendChild(badge);

  // Connection line from center to openclaw
  const line = document.createElement('div');
  line.className = 'inner-connection';
  const dx = x - cx, dy = y - cy;
  const len = Math.sqrt(dx*dx + dy*dy) - 50;
  const ang = Math.atan2(dy, dx) * 180 / Math.PI;
  line.style.width = Math.max(0, len - 50) + 'px';
  line.style.transform = `rotate(${ang}deg) translateX(100px)`;
  container.appendChild(line);
}

// Draw Guardians
guardians.forEach((g, i) => {
  const angle = (i / guardians.length) * Math.PI * 2 - Math.PI / 2;
  const x = cx + Math.cos(angle) * guardianRadius;
  const y = cy + Math.sin(angle) * guardianRadius;

  // Branch line
  const line = document.createElement('div');
  line.className = `branch-line branch-${g.tier}`;
  const dx = x - cx, dy = y - cy;
  const len = Math.sqrt(dx*dx + dy*dy);
  const ang = Math.atan2(dy, dx) * 180 / Math.PI;
  line.style.width = (len - 260) + 'px';
  line.style.transform = `rotate(${ang}deg) translateX(210px)`;
  container.appendChild(line);

  // Guardian node
  const node = document.createElement('div');
  node.className = `guardian-node guardian-${g.tier}`;
  node.style.left = x + 'px';
  node.style.top = y + 'px';
  node.style.transform = 'translate(-50%, -50%)';
  node.innerHTML = `
    <div class="icon">${g.icon}</div>
    <div class="label">${g.name}</div>
    <div class="sublabel">${g.sub}</div>
  `;
  container.appendChild(node);
});

// Ambient particles
for (let i = 0; i < 30; i++) {
  const p = document.createElement('div');
  p.className = 'ambient';
  p.style.left = Math.random() * 100 + '%';
  p.style.top = Math.random() * 100 + '%';
  p.style.animationDelay = Math.random() * 8 + 's';
  p.style.animationDuration = (6 + Math.random() * 6) + 's';
  if (Math.random() > 0.5) p.style.background = 'rgba(102,204,255,0.3)';
  if (Math.random() > 0.8) p.style.background = 'rgba(168,85,247,0.3)';
  document.body.appendChild(p);
}
</script>
</body>
</html>
