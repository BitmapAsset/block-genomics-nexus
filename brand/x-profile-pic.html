<!DOCTYPE html>
<html><head><style>
body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; width: 400px; height: 400px; }
canvas { width: 400px; height: 400px; }
</style></head><body>
<canvas id="c" width="400" height="400"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const W = 400;

// Background - dark with subtle radial gradient
const bg = ctx.createRadialGradient(W/2, W/2, 0, W/2, W/2, W/2);
bg.addColorStop(0, '#1a1a2e');
bg.addColorStop(1, '#0a0a12');
ctx.fillStyle = bg;
ctx.fillRect(0, 0, W, W);

// Draw Crown Shield
const cx = W/2, cy = W/2 + 10;
const s = 2.8; // scale

// Outer glow
ctx.save();
ctx.shadowColor = 'rgba(247,147,26,0.6)';
ctx.shadowBlur = 30;

// Shield body
ctx.beginPath();
ctx.moveTo(cx, cy - 42*s);
ctx.bezierCurveTo(cx - 20*s, cy - 42*s, cx - 42*s, cy - 36*s, cx - 44*s, cy - 24*s);
ctx.lineTo(cx - 44*s, cy + 2*s);
ctx.bezierCurveTo(cx - 44*s, cy + 22*s, cx - 30*s, cy + 36*s, cx, cy + 48*s);
ctx.bezierCurveTo(cx + 30*s, cy + 36*s, cx + 44*s, cy + 22*s, cx + 44*s, cy + 2*s);
ctx.lineTo(cx + 44*s, cy - 24*s);
ctx.bezierCurveTo(cx + 42*s, cy - 36*s, cx + 20*s, cy - 42*s, cx, cy - 42*s);
ctx.closePath();

const grd = ctx.createLinearGradient(cx, cy - 42*s, cx, cy + 48*s);
grd.addColorStop(0, '#f7931a');
grd.addColorStop(1, '#cc6600');
ctx.strokeStyle = grd;
ctx.lineWidth = 4;
ctx.stroke();

// Fill shield dark
const fgrd = ctx.createLinearGradient(cx, cy - 42*s, cx, cy + 48*s);
fgrd.addColorStop(0, '#1e1e38');
fgrd.addColorStop(1, '#0c0c1a');
ctx.fillStyle = fgrd;
ctx.fill();
ctx.restore();

// Inner shield border
ctx.beginPath();
ctx.moveTo(cx, cy - 36*s);
ctx.bezierCurveTo(cx - 17*s, cy - 36*s, cx - 37*s, cy - 31*s, cx - 38*s, cy - 21*s);
ctx.lineTo(cx - 38*s, cy + 1*s);
ctx.bezierCurveTo(cx - 38*s, cy + 19*s, cx - 26*s, cy + 31*s, cx, cy + 42*s);
ctx.bezierCurveTo(cx + 26*s, cy + 31*s, cx + 38*s, cy + 19*s, cx + 38*s, cy + 1*s);
ctx.lineTo(cx + 38*s, cy - 21*s);
ctx.bezierCurveTo(cx + 37*s, cy - 31*s, cx + 17*s, cy - 36*s, cx, cy - 36*s);
ctx.closePath();
ctx.strokeStyle = 'rgba(247,147,26,0.3)';
ctx.lineWidth = 2;
ctx.stroke();

// Crown - 3 spikes
ctx.save();
ctx.shadowColor = 'rgba(247,147,26,0.8)';
ctx.shadowBlur = 15;
const crownY = cy - 42*s;
const crownW = 28*s;

// Left spike
ctx.beginPath();
ctx.moveTo(cx - crownW*0.4, crownY + 2);
ctx.lineTo(cx - crownW*0.35, crownY - 20*s);
ctx.lineTo(cx - crownW*0.25, crownY + 2);
ctx.fillStyle = '#f7931a';
ctx.fill();
// Orb
ctx.beginPath();
ctx.arc(cx - crownW*0.35, crownY - 22*s, 4*s, 0, Math.PI*2);
ctx.fillStyle = '#ffcc44';
ctx.fill();

// Center spike (tallest)
ctx.beginPath();
ctx.moveTo(cx - 8*s, crownY + 2);
ctx.lineTo(cx, crownY - 30*s);
ctx.lineTo(cx + 8*s, crownY + 2);
ctx.fillStyle = '#f7931a';
ctx.fill();
ctx.beginPath();
ctx.arc(cx, crownY - 32*s, 5*s, 0, Math.PI*2);
ctx.fillStyle = '#ffcc44';
ctx.fill();

// Right spike
ctx.beginPath();
ctx.moveTo(cx + crownW*0.25, crownY + 2);
ctx.lineTo(cx + crownW*0.35, crownY - 20*s);
ctx.lineTo(cx + crownW*0.4, crownY + 2);
ctx.fillStyle = '#f7931a';
ctx.fill();
ctx.beginPath();
ctx.arc(cx + crownW*0.35, crownY - 22*s, 4*s, 0, Math.PI*2);
ctx.fillStyle = '#ffcc44';
ctx.fill();
ctx.restore();

// ₿ symbol center
ctx.save();
ctx.font = 'bold 80px Arial';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillStyle = '#f7931a';
ctx.shadowColor = 'rgba(247,147,26,0.5)';
ctx.shadowBlur = 20;
ctx.fillText('₿', cx, cy + 5);
ctx.restore();

// Green checkmark bottom
ctx.save();
ctx.font = 'bold 32px Arial';
ctx.textAlign = 'center';
ctx.fillStyle = '#00cc66';
ctx.shadowColor = 'rgba(0,204,102,0.5)';
ctx.shadowBlur = 10;
ctx.fillText('✓', cx, cy + 38*s);
ctx.restore();
</script>
</body></html>
