<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Crown Shield — Final</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a14; color: #fff; font-family: -apple-system, sans-serif; padding: 30px; }
  h1 { text-align: center; font-size: 22px; color: #f7931a; margin-bottom: 6px; }
  .sub { text-align: center; color: #666; font-size: 12px; margin-bottom: 40px; }
  .section { text-align: center; margin-bottom: 40px; }
  .section h2 { font-size: 15px; color: #999; margin-bottom: 20px; }
  .row { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; }
  .item { text-align: center; }
  .label { font-size: 12px; font-weight: 700; margin-top: 8px; }
  .sublabel { font-size: 10px; color: #555; }
  hr { border: none; border-top: 1px solid #1a1a2e; margin: 15px auto 35px; width: 60%; }
  .chip { display: inline-flex; align-items: center; gap: 8px; background: #0d0d1a; border: 1px solid #1a1a2e; border-radius: 12px; padding: 10px 18px; margin: 5px; }
  .chip .n { font-weight: 700; font-size: 14px; }
  .chip .h { color: #666; font-size: 11px; }
  .card { background: #0d0d1a; border: 1px solid #1a1a2e; border-radius: 14px; padding: 18px 22px; min-width: 200px; max-width: 260px; text-align: left; }
  .card .hdr { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .card .bio { color: #888; font-size: 11px; line-height: 1.5; }
  .card .meta { color: #444; font-size: 9px; margin-top: 6px; }
  .sizes { display: flex; gap: 25px; align-items: flex-end; justify-content: center; }
  .sizes .si { text-align: center; }
  .sizes .si span { display: block; color: #555; font-size: 9px; margin-top: 3px; }
</style>
</head>
<body>
<h1>👑 Crown Shield — Refined</h1>
<p class="sub">Universal verification badge for Block Genomics</p>

<div class="section">
<h2>Full Size — 3 Tiers</h2>
<div class="row" id="hero"></div>
</div>
<hr>
<div class="section">
<h2>Scale Test</h2>
<div id="scales"></div>
</div>
<hr>
<div class="section">
<h2>Next to Handles</h2>
<div id="handles"></div>
</div>
<hr>
<div class="section">
<h2>Profile Cards</h2>
<div class="row" id="cards"></div>
</div>

<script>
const T = {
  1: { c: '#f7931a', a: '#ffd27d', l: 'GOLD', f: 'Tier 1 — Block Owner' },
  2: { c: '#66ccff', a: '#b0e0ff', l: 'CYAN', f: 'Tier 2 — Parcel Owner' },
  3: { c: '#a855f7', a: '#d4a8ff', l: 'PURPLE', f: 'Tier 3 — Delegated' },
};

function makeSVG(size, tier) {
  const t = T[tier];
  const s = size;
  const cx = s/2, cy = s/2;
  const sc = s/100;
  
  // Shield path
  const sp = `M${cx},${cy-36*sc} C${cx+16*sc},${cy-36*sc} ${cx+33*sc},${cy-31*sc} ${cx+34*sc},${cy-23*sc} L${cx+34*sc},${cy+3*sc} C${cx+32*sc},${cy+18*sc} ${cx+20*sc},${cy+31*sc} ${cx},${cy+42*sc} C${cx-20*sc},${cy+31*sc} ${cx-32*sc},${cy+18*sc} ${cx-34*sc},${cy+3*sc} L${cx-34*sc},${cy-23*sc} C${cx-33*sc},${cy-31*sc} ${cx-16*sc},${cy-36*sc} ${cx},${cy-36*sc} Z`;
  
  // Crown points
  const crY = cy - 27*sc;
  const cW = 18*sc;
  const cH = 11*sc;
  const crownPath = `M${cx-cW},${crY} L${cx-cW*0.5},${crY-cH*0.8} L${cx-cW*0.15},${crY-2*sc} L${cx},${crY-cH-2*sc} L${cx+cW*0.15},${crY-2*sc} L${cx+cW*0.5},${crY-cH*0.8} L${cx+cW},${crY} Z`;
  
  // Check mark
  const ckY = cy + 30*sc;
  const ckS = 5.5*sc;
  
  // BTC position
  const btcY = cy + 4*sc;
  const btcSize = Math.max(28*sc, 10);
  
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="glow${tier}${s}" cx="50%" cy="52%" r="48%">
        <stop offset="0%" stop-color="${t.c}" stop-opacity="0.35"/>
        <stop offset="60%" stop-color="${t.c}" stop-opacity="0.06"/>
        <stop offset="100%" stop-color="${t.c}" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="fill${tier}${s}" x1="50%" y1="0%" x2="50%" y2="100%">
        <stop offset="0%" stop-color="#1a1a30"/>
        <stop offset="40%" stop-color="#101020"/>
        <stop offset="100%" stop-color="#08081a"/>
      </linearGradient>
      <linearGradient id="border${tier}${s}" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="${t.c}"/>
        <stop offset="30%" stop-color="${t.a}"/>
        <stop offset="70%" stop-color="${t.a}"/>
        <stop offset="100%" stop-color="${t.c}"/>
      </linearGradient>
      <linearGradient id="crown${tier}${s}" x1="50%" y1="0%" x2="50%" y2="100%">
        <stop offset="0%" stop-color="${t.a}"/>
        <stop offset="60%" stop-color="${t.c}"/>
        <stop offset="100%" stop-color="${t.c}" stop-opacity="0.7"/>
      </linearGradient>
      <linearGradient id="btc${tier}${s}" x1="50%" y1="0%" x2="50%" y2="100%">
        <stop offset="0%" stop-color="${t.a}"/>
        <stop offset="40%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="${t.c}"/>
      </linearGradient>
      <radialGradient id="btcglow${tier}${s}" cx="50%" cy="${(btcY/s*100).toFixed(0)}%" r="16%">
        <stop offset="0%" stop-color="${t.c}" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="${t.c}" stop-opacity="0"/>
      </radialGradient>
      <filter id="shadow${tier}${s}">
        <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="${t.c}" flood-opacity="0.3"/>
      </filter>
    </defs>
    
    <!-- Outer glow -->
    <circle cx="${cx}" cy="${cy}" r="${s*0.48}" fill="url(#glow${tier}${s})"/>
    
    <!-- Shield fill -->
    <path d="${sp}" fill="url(#fill${tier}${s})"/>
    
    <!-- Shield border -->
    <path d="${sp}" fill="none" stroke="url(#border${tier}${s})" stroke-width="${Math.max(2.5*sc, 1.5)}"/>
    
    <!-- Inner border -->
    <path d="${sp}" fill="none" stroke="${t.c}" stroke-opacity="0.15" stroke-width="${Math.max(0.8*sc, 0.5)}" transform="translate(${cx},${cy}) scale(0.88) translate(${-cx},${-cy})"/>
    
    <!-- Crown -->
    <path d="${crownPath}" fill="url(#crown${tier}${s})" stroke="${t.a}" stroke-opacity="0.4" stroke-width="${Math.max(0.5*sc, 0.3)}"/>
    
    <!-- Crown base band -->
    <rect x="${cx-cW}" y="${crY}" width="${cW*2}" height="${3*sc}" rx="${1*sc}" fill="${t.c}"/>
    
    <!-- Crown jewels -->
    <circle cx="${cx-cW*0.5}" cy="${crY-cH*0.8+1.5*sc}" r="${1.2*sc}" fill="white" fill-opacity="0.6"/>
    <circle cx="${cx}" cy="${crY-cH-2*sc+1.5*sc}" r="${1.5*sc}" fill="white" fill-opacity="0.7"/>
    <circle cx="${cx+cW*0.5}" cy="${crY-cH*0.8+1.5*sc}" r="${1.2*sc}" fill="white" fill-opacity="0.6"/>
    
    <!-- BTC glow -->
    <circle cx="${cx}" cy="${btcY}" r="${16*sc}" fill="url(#btcglow${tier}${s})"/>
    
    <!-- ₿ symbol -->
    <text x="${cx}" y="${btcY}" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-weight="bold" font-size="${btcSize}" fill="url(#btc${tier}${s})" filter="url(#shadow${tier}${s})">₿</text>
    
    <!-- Verified check circle -->
    <circle cx="${cx}" cy="${ckY}" r="${ckS+2*sc}" fill="#22ff88" fill-opacity="0.08"/>
    
    <!-- Check mark -->
    <polyline points="${cx-ckS*0.7},${ckY} ${cx-ckS*0.15},${ckY+ckS*0.55} ${cx+ckS*0.8},${ckY-ckS*0.45}" fill="none" stroke="#22ff88" stroke-width="${Math.max(2.2*sc, 1.2)}" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

// Hero
const hero = document.getElementById('hero');
[1,2,3].forEach(t => {
  const d = document.createElement('div');
  d.className = 'item';
  d.innerHTML = makeSVG(180, t) + `<div class="label" style="color:${T[t].c}">${T[t].l}</div><div class="sublabel">${T[t].f}</div>`;
  hero.appendChild(d);
});

// Scale test
const scales = document.getElementById('scales');
[1,2,3].forEach(t => {
  const row = document.createElement('div');
  row.className = 'sizes';
  row.style.marginBottom = '20px';
  [16,24,32,48,64,96,140].forEach(sz => {
    const si = document.createElement('div');
    si.className = 'si';
    si.innerHTML = makeSVG(sz, t) + `<span>${sz}px</span>`;
    row.appendChild(si);
  });
  scales.appendChild(row);
});

// Handles
const handles = document.getElementById('handles');
[
  { n: 'Gravity', h: '@gravity', t: 1 },
  { n: 'Pepe', h: '@pepe', t: 1 },
  { n: 'Builder42', h: '@builder42', t: 2 },
  { n: 'NewUser', h: '@newuser', t: 3 },
].forEach(u => {
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.innerHTML = makeSVG(26, u.t) + `<span class="n">${u.n}</span><span class="h">${u.h}</span>`;
  handles.appendChild(chip);
});

// Cards
const cards = document.getElementById('cards');
[
  { n: 'Gravity', h: '@gravity', t: 1, bio: 'Polymath. Builder. Bitmap pioneer.', meta: 'Trust: 94 · Block #500000' },
  { n: 'Agent Alpha', h: '@agent_alpha', t: 2, bio: 'Autonomous trading agent.', meta: 'Trust: 72 · Parcel #210000:tx42' },
  { n: 'Explorer', h: '@explorer', t: 3, bio: 'Learning the ropes.', meta: 'Trust: 45 · Delegated via @gravity' },
].forEach(p => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="hdr">${makeSVG(30, p.t)}<span class="n" style="font-size:13px;font-weight:700">${p.n}</span><span style="color:#666;font-size:10px">${p.h}</span></div><div class="bio">${p.bio}</div><div class="meta">${p.meta}</div>`;
  cards.appendChild(card);
});
</script>
</body>
</html>
