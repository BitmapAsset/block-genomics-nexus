<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #0a0a0f; gap: 60px; padding: 40px; }
  .label { color: #475569; font-family: monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 12px; }
  .version { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .logo-full { display: flex; align-items: center; gap: 16px; }
  .logo-text {
    font-family: -apple-system, 'SF Pro Display', 'Inter', sans-serif;
    font-weight: 900;
    font-size: 42px;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #f7931a 0%, #ffb347 40%, #ffffff 70%, #f7931a 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 20px rgba(247,147,26,0.4));
  }
  .logo-square {
    width: 200px; height: 200px; border-radius: 32px;
    background: linear-gradient(135deg, #0a0a12 0%, #1a1008 100%);
    border: 2px solid rgba(247,147,26,0.2);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 40px rgba(247,147,26,0.15);
  }
  .watermark { display: flex; align-items: center; gap: 10px; opacity: 0.85; }
  .watermark-text {
    font-family: -apple-system, 'SF Pro Display', 'Inter', sans-serif;
    font-weight: 800; font-size: 24px; color: white;
    letter-spacing: -0.5px; text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

<!-- VERSION 1: Full Logo — Bitcoin Orange -->
<div class="version">
  <div class="label">Full Logo — Bitcoin Orange</div>
  <div class="logo-full">
    <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
      <defs>
        <linearGradient id="o1" x1="0" y1="0" x2="64" y2="64">
          <stop offset="0%" stop-color="#f7931a"/>
          <stop offset="100%" stop-color="#ff6600"/>
        </linearGradient>
        <linearGradient id="o2" x1="0" y1="0" x2="64" y2="64">
          <stop offset="0%" stop-color="#ffb347"/>
          <stop offset="100%" stop-color="#f7931a"/>
        </linearGradient>
      </defs>
      <!-- Bitmap grid with orange blocks -->
      <rect x="8" y="8" width="14" height="14" rx="2" fill="url(#o1)"/>
      <rect x="25" y="8" width="14" height="14" rx="2" fill="#f7931a" opacity="0.6"/>
      <rect x="42" y="8" width="14" height="14" rx="2" fill="url(#o2)"/>
      <rect x="8" y="25" width="14" height="14" rx="2" fill="#ffb347" opacity="0.5"/>
      <rect x="25" y="25" width="14" height="14" rx="2" fill="#f7931a"/>
      <rect x="42" y="25" width="14" height="14" rx="2" fill="#ff8800" opacity="0.7"/>
      <rect x="8" y="42" width="14" height="14" rx="2" fill="url(#o2)" opacity="0.7"/>
      <rect x="25" y="42" width="14" height="14" rx="2" fill="#ff6600" opacity="0.5"/>
      <rect x="42" y="42" width="14" height="14" rx="2" fill="url(#o1)"/>
      <!-- ₿ center -->
      <text x="32" y="37" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="14" fill="#ffffff">₿</text>
    </svg>
    <span class="logo-text">Block Genomics</span>
  </div>
</div>

<!-- VERSION 2: App Icon — Orange -->
<div class="version">
  <div class="label">App Icon — Bitcoin Orange</div>
  <div class="logo-square">
    <svg width="120" height="120" viewBox="0 0 64 64" fill="none">
      <defs>
        <linearGradient id="o3" x1="0" y1="0" x2="64" y2="64">
          <stop offset="0%" stop-color="#f7931a"/>
          <stop offset="100%" stop-color="#ff6600"/>
        </linearGradient>
        <linearGradient id="o4" x1="0" y1="0" x2="64" y2="64">
          <stop offset="0%" stop-color="#ffb347"/>
          <stop offset="100%" stop-color="#f7931a"/>
        </linearGradient>
      </defs>
      <rect x="8" y="8" width="14" height="14" rx="2" fill="url(#o3)"/>
      <rect x="25" y="8" width="14" height="14" rx="2" fill="#f7931a" opacity="0.6"/>
      <rect x="42" y="8" width="14" height="14" rx="2" fill="url(#o4)"/>
      <rect x="8" y="25" width="14" height="14" rx="2" fill="#ffb347" opacity="0.5"/>
      <rect x="25" y="25" width="14" height="14" rx="2" fill="#f7931a"/>
      <rect x="42" y="25" width="14" height="14" rx="2" fill="#ff8800" opacity="0.7"/>
      <rect x="8" y="42" width="14" height="14" rx="2" fill="url(#o4)" opacity="0.7"/>
      <rect x="25" y="42" width="14" height="14" rx="2" fill="#ff6600" opacity="0.5"/>
      <rect x="42" y="42" width="14" height="14" rx="2" fill="url(#o3)"/>
      <text x="32" y="37" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="14" fill="#ffffff">₿</text>
    </svg>
  </div>
</div>

<!-- VERSION 3: Watermark Orange -->
<div class="version">
  <div class="label">Watermark — Orange</div>
  <div class="watermark">
    <svg width="28" height="28" viewBox="0 0 64 64" fill="none">
      <rect x="8" y="8" width="14" height="14" rx="2" fill="#f7931a"/>
      <rect x="25" y="8" width="14" height="14" rx="2" fill="#f7931a" opacity="0.6"/>
      <rect x="42" y="8" width="14" height="14" rx="2" fill="#f7931a" opacity="0.8"/>
      <rect x="8" y="25" width="14" height="14" rx="2" fill="#f7931a" opacity="0.5"/>
      <rect x="25" y="25" width="14" height="14" rx="2" fill="#f7931a"/>
      <rect x="42" y="25" width="14" height="14" rx="2" fill="#f7931a" opacity="0.7"/>
      <rect x="8" y="42" width="14" height="14" rx="2" fill="#f7931a" opacity="0.7"/>
      <rect x="25" y="42" width="14" height="14" rx="2" fill="#f7931a" opacity="0.5"/>
      <rect x="42" y="42" width="14" height="14" rx="2" fill="#f7931a"/>
      <text x="32" y="37" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="14" fill="#fff">₿</text>
    </svg>
    <span class="watermark-text">Block Genomics</span>
  </div>
</div>

<!-- VERSION 4: End Card Orange -->
<div class="version">
  <div class="label">End Card — Bitcoin Orange</div>
  <div style="background: linear-gradient(135deg, #0a0a12, #1a1008); border-radius: 20px; padding: 40px 60px; border: 1px solid rgba(247,147,26,0.25); text-align: center; box-shadow: 0 0 60px rgba(247,147,26,0.12);">
    <div class="logo-full" style="justify-content: center; margin-bottom: 20px;">
      <svg width="48" height="48" viewBox="0 0 64 64" fill="none">
        <defs>
          <linearGradient id="o5" x1="0" y1="0" x2="64" y2="64">
            <stop offset="0%" stop-color="#f7931a"/>
            <stop offset="100%" stop-color="#ff6600"/>
          </linearGradient>
        </defs>
        <rect x="8" y="8" width="14" height="14" rx="2" fill="url(#o5)"/>
        <rect x="25" y="8" width="14" height="14" rx="2" fill="#f7931a" opacity="0.6"/>
        <rect x="42" y="8" width="14" height="14" rx="2" fill="#ffb347"/>
        <rect x="8" y="25" width="14" height="14" rx="2" fill="#ffb347" opacity="0.5"/>
        <rect x="25" y="25" width="14" height="14" rx="2" fill="#f7931a"/>
        <rect x="42" y="25" width="14" height="14" rx="2" fill="#ff8800" opacity="0.7"/>
        <rect x="8" y="42" width="14" height="14" rx="2" fill="#ffb347" opacity="0.7"/>
        <rect x="25" y="42" width="14" height="14" rx="2" fill="#ff6600" opacity="0.5"/>
        <rect x="42" y="42" width="14" height="14" rx="2" fill="url(#o5)"/>
        <text x="32" y="37" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="14" fill="#fff">₿</text>
      </svg>
      <span class="logo-text" style="font-size: 36px;">Block Genomics</span>
    </div>
    <div style="color: rgba(247,147,26,0.8); font-family: -apple-system, sans-serif; font-size: 14px; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 8px;">Own · Build · Live</div>
    <div style="color: #ffffff; font-family: -apple-system, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 1px;">blockgenomics.io</div>
  </div>
</div>

</body>
</html>
