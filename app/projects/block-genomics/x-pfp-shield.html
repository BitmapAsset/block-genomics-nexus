<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 800px; height: 800px; overflow: hidden; background: #020408; display: flex; align-items: center; justify-content: center; }
canvas { width: 800px; height: 800px; }
</style>
</head>
<body>
<canvas id="c" width="800" height="800"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const W = 800, H = 800, cx = W/2, cy = H/2;

// Gold tier colors
const gold = '#FFD700';
const amber = '#F7931A';
const lightGold = '#FFE066';
const darkGold = '#C87A0A';

// === BACKGROUND ===
const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 420);
bg.addColorStop(0, '#0c0e1a');
bg.addColorStop(0.4, '#060810');
bg.addColorStop(1, '#020306');
ctx.fillStyle = bg;
ctx.fillRect(0, 0, W, H);

// Subtle ambient particles
for (let i = 0; i < 60; i++) {
  const a = Math.random() * Math.PI * 2;
  const d = 250 + Math.random() * 150;
  const x = cx + Math.cos(a) * d;
  const y = cy + Math.sin(a) * d;
  ctx.beginPath();
  ctx.arc(x, y, 0.5 + Math.random() * 1.2, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(247,147,26,${0.1 + Math.random() * 0.25})`;
  ctx.fill();
}

// Scale factor for the shield
const S = 3.2; // Scale from 100-unit SVG to ~320px
const ox = cx - 50 * S; // Offset X
const oy = cy - 58 * S; // Offset Y (center the shield+crown)

function transformX(x) { return ox + x * S; }
function transformY(y) { return oy + y * S; }

// === OUTER GLOW ===
function drawShieldPath() {
  ctx.beginPath();
  ctx.moveTo(transformX(50), transformY(18));
  ctx.bezierCurveTo(transformX(30), transformY(18), transformX(10), transformY(24), transformX(8), transformY(36));
  ctx.lineTo(transformX(8), transformY(62));
  ctx.bezierCurveTo(transformX(8), transformY(82), transformX(22), transformY(96), transformX(50), transformY(108));
  ctx.bezierCurveTo(transformX(78), transformY(96), transformX(92), transformY(82), transformX(92), transformY(62));
  ctx.lineTo(transformX(92), transformY(36));
  ctx.bezierCurveTo(transformX(90), transformY(24), transformX(70), transformY(18), transformX(50), transformY(18));
  ctx.closePath();
}

function drawInnerShieldPath() {
  ctx.beginPath();
  ctx.moveTo(transformX(50), transformY(23));
  ctx.bezierCurveTo(transformX(33), transformY(23), transformX(15), transformY(28), transformX(13), transformY(38));
  ctx.lineTo(transformX(13), transformY(61));
  ctx.bezierCurveTo(transformX(13), transformY(79), transformX(25), transformY(91), transformX(50), transformY(102));
  ctx.bezierCurveTo(transformX(75), transformY(91), transformX(87), transformY(79), transformX(87), transformY(61));
  ctx.lineTo(transformX(87), transformY(38));
  ctx.bezierCurveTo(transformX(85), transformY(28), transformX(67), transformY(23), transformX(50), transformY(23));
  ctx.closePath();
}

// Multiple glow layers
for (let i = 4; i > 0; i--) {
  drawShieldPath();
  ctx.shadowColor = amber;
  ctx.shadowBlur = i * 20;
  ctx.strokeStyle = `rgba(247,147,26,${0.05 * i})`;
  ctx.lineWidth = i * 6 * S / 3;
  ctx.stroke();
}
ctx.shadowBlur = 0;

// === SHIELD FILL ===
drawShieldPath();
const shieldFill = ctx.createLinearGradient(transformX(50), transformY(18), transformX(50), transformY(108));
shieldFill.addColorStop(0, '#1e1e38');
shieldFill.addColorStop(0.3, '#151528');
shieldFill.addColorStop(1, '#0c0c1a');
ctx.fillStyle = shieldFill;
ctx.fill();

// === SHIELD OUTER BORDER ===
drawShieldPath();
const borderGrad = ctx.createLinearGradient(transformX(8), transformY(18), transformX(92), transformY(108));
borderGrad.addColorStop(0, lightGold);
borderGrad.addColorStop(0.3, gold);
borderGrad.addColorStop(0.5, amber);
borderGrad.addColorStop(0.7, gold);
borderGrad.addColorStop(1, lightGold);
ctx.strokeStyle = borderGrad;
ctx.lineWidth = 3 * S / 3;
ctx.stroke();

// === INNER BORDER ===
drawInnerShieldPath();
ctx.strokeStyle = `rgba(255,215,0,0.25)`;
ctx.lineWidth = 1 * S / 3;
ctx.stroke();

// === BITMAP MONDRIAN PATTERN ===
ctx.save();
drawInnerShieldPath();
ctx.clip();

const mondBlocks = [
  [14,30,12,10], [28,28,8,8], [38,32,14,6], [55,29,10,10], [67,30,7,7], [76,28,9,11],
  [16,44,18,8], [36,42,6,12], [44,44,15,7], [62,43,10,9], [74,44,11,6],
  [18,56,8,14], [28,58,16,6], [46,55,9,10], [58,57,12,7], [72,56,8,9],
  [22,72,14,8], [38,70,10,10], [50,72,16,6], [68,71,8,8],
  [30,84,12,7], [44,83,8,10], [55,85,14,6],
  [38,95,10,6], [50,94,12,5],
];
mondBlocks.forEach(([bx, by, bw, bh]) => {
  ctx.fillStyle = `rgba(255,215,0,${0.06 + Math.random() * 0.08})`;
  ctx.fillRect(transformX(bx), transformY(by), bw * S, bh * S);
  // Thin gap
  ctx.strokeStyle = 'rgba(255,215,0,0.03)';
  ctx.lineWidth = 0.5;
  ctx.strokeRect(transformX(bx), transformY(by), bw * S, bh * S);
});
ctx.restore();

// === CROWN ===
const crownPoints = [
  [30, 22], [34, 8], [42, 18], [50, 4], [58, 18], [66, 8], [70, 22]
];

// Crown fill
ctx.beginPath();
crownPoints.forEach(([x, y], i) => {
  i === 0 ? ctx.moveTo(transformX(x), transformY(y)) : ctx.lineTo(transformX(x), transformY(y));
});
ctx.closePath();
const crownFill = ctx.createLinearGradient(transformX(50), transformY(4), transformX(50), transformY(22));
crownFill.addColorStop(0, lightGold);
crownFill.addColorStop(0.4, gold);
crownFill.addColorStop(1, amber);
ctx.fillStyle = crownFill;
ctx.shadowColor = gold;
ctx.shadowBlur = 25;
ctx.fill();
ctx.shadowBlur = 0;

// Crown border
ctx.beginPath();
crownPoints.forEach(([x, y], i) => {
  i === 0 ? ctx.moveTo(transformX(x), transformY(y)) : ctx.lineTo(transformX(x), transformY(y));
});
ctx.strokeStyle = lightGold;
ctx.lineWidth = 2.5;
ctx.lineCap = 'round';
ctx.lineJoin = 'round';
ctx.stroke();

// Crown orb tips
[[34, 7, 4.5], [50, 3, 5.5], [66, 7, 4.5]].forEach(([x, y, r]) => {
  // Glow
  ctx.beginPath();
  ctx.arc(transformX(x), transformY(y), r * S / 2.5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,230,100,0.25)';
  ctx.fill();
  // Orb
  ctx.beginPath();
  ctx.arc(transformX(x), transformY(y), r * S / 4, 0, Math.PI * 2);
  const orbGrad = ctx.createRadialGradient(
    transformX(x), transformY(y), 0,
    transformX(x), transformY(y), r * S / 4
  );
  orbGrad.addColorStop(0, '#fff');
  orbGrad.addColorStop(0.5, lightGold);
  orbGrad.addColorStop(1, gold);
  ctx.fillStyle = orbGrad;
  ctx.fill();
});

// Center orb special — slightly cyan
ctx.beginPath();
ctx.arc(transformX(50), transformY(3), 3 * S / 4, 0, Math.PI * 2);
ctx.fillStyle = 'rgba(0,255,200,0.15)';
ctx.fill();

// === ₿ SYMBOL ===
const fontSize = 42 * S;
ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial`;
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
const btcX = transformX(50);
const btcY = transformY(63);

// Glow layers
[35, 20, 10].forEach((blur, i) => {
  ctx.shadowColor = amber;
  ctx.shadowBlur = blur;
  ctx.fillStyle = `rgba(255,215,0,${0.05 + i * 0.03})`;
  ctx.fillText('₿', btcX, btcY);
});
ctx.shadowBlur = 0;

// Main ₿ gradient
const btcGrad = ctx.createLinearGradient(btcX, btcY - fontSize/2, btcX, btcY + fontSize/2);
btcGrad.addColorStop(0, lightGold);
btcGrad.addColorStop(0.3, '#fff');
btcGrad.addColorStop(0.5, 'rgba(255,255,255,0.9)');
btcGrad.addColorStop(0.7, gold);
btcGrad.addColorStop(1, amber);
ctx.fillStyle = btcGrad;
ctx.fillText('₿', btcX, btcY);

// Subtle edge
ctx.strokeStyle = 'rgba(255,230,100,0.15)';
ctx.lineWidth = 1;
ctx.strokeText('₿', btcX, btcY);

// === GREEN VERIFIED CHECKMARK ===
const checkCx = transformX(50);
const checkCy = transformY(96);

// Glow
ctx.beginPath();
ctx.arc(checkCx, checkCy, 12 * S / 3, 0, Math.PI * 2);
ctx.fillStyle = 'rgba(34,255,136,0.12)';
ctx.fill();

// Check mark
ctx.beginPath();
ctx.moveTo(checkCx - 10 * S / 3, checkCy);
ctx.lineTo(checkCx - 2 * S / 3, checkCy + 8 * S / 3);
ctx.lineTo(checkCx + 12 * S / 3, checkCy - 8 * S / 3);
ctx.strokeStyle = '#22ff88';
ctx.lineWidth = 4 * S / 3;
ctx.lineCap = 'round';
ctx.lineJoin = 'round';
ctx.shadowColor = '#22ff88';
ctx.shadowBlur = 15;
ctx.stroke();
ctx.shadowBlur = 0;
</script>
</body>
</html>
