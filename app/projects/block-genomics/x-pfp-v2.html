<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 800px; height: 800px; overflow: hidden; background: #000; }
canvas { width: 800px; height: 800px; }
</style>
</head>
<body>
<canvas id="c" width="800" height="800"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const W = 800, H = 800, cx = W/2, cy = H/2;

// === BACKGROUND === Deep space with subtle radial
const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 450);
bg.addColorStop(0, '#0c1020');
bg.addColorStop(0.6, '#060810');
bg.addColorStop(1, '#020204');
ctx.fillStyle = bg;
ctx.fillRect(0, 0, W, H);

// === AMBIENT PARTICLES === Sparse, elegant
for (let i = 0; i < 50; i++) {
  const x = Math.random() * W;
  const y = Math.random() * H;
  const dist = Math.sqrt((x-cx)**2 + (y-cy)**2);
  if (dist < 160 || dist > 380) continue;
  const s = 0.5 + Math.random() * 1.5;
  ctx.beginPath();
  ctx.arc(x, y, s, 0, Math.PI * 2);
  ctx.fillStyle = Math.random() > 0.6 
    ? `rgba(247,147,26,${0.2 + Math.random() * 0.4})`
    : `rgba(0,200,255,${0.15 + Math.random() * 0.25})`;
  ctx.fill();
}

// === OUTER RING — Thin elegant orbit ===
ctx.save();
ctx.translate(cx, cy);
ctx.rotate(-0.15);
ctx.scale(1, 0.35);
ctx.beginPath();
ctx.arc(0, 0, 320, 0, Math.PI * 2);
ctx.restore();
ctx.strokeStyle = 'rgba(0,200,255,0.12)';
ctx.lineWidth = 1.2;
ctx.stroke();

// Second orbit
ctx.save();
ctx.translate(cx, cy);
ctx.rotate(0.4);
ctx.scale(1, 0.3);
ctx.beginPath();
ctx.arc(0, 0, 350, 0, Math.PI * 2);
ctx.restore();
ctx.strokeStyle = 'rgba(247,147,26,0.08)';
ctx.lineWidth = 1;
ctx.stroke();

// === MAIN CIRCLE — Clean, premium ===
// Outer glow
for (let i = 3; i > 0; i--) {
  ctx.beginPath();
  ctx.arc(cx, cy, 180 + i * 5, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(247,147,26,${0.04 * i})`;
  ctx.lineWidth = i * 4;
  ctx.stroke();
}

// Circle border — gradient
const circGrad = ctx.createLinearGradient(cx - 180, cy - 180, cx + 180, cy + 180);
circGrad.addColorStop(0, '#ffd700');
circGrad.addColorStop(0.3, '#f7931a');
circGrad.addColorStop(0.7, '#e8850f');
circGrad.addColorStop(1, '#ffc107');
ctx.beginPath();
ctx.arc(cx, cy, 178, 0, Math.PI * 2);
ctx.strokeStyle = circGrad;
ctx.lineWidth = 3;
ctx.stroke();

// Circle fill — deep dark
const circleFill = ctx.createRadialGradient(cx, cy - 30, 0, cx, cy, 180);
circleFill.addColorStop(0, '#0e1428');
circleFill.addColorStop(1, '#060a14');
ctx.beginPath();
ctx.arc(cx, cy, 176, 0, Math.PI * 2);
ctx.fillStyle = circleFill;
ctx.fill();

// === GENOME PATTERN — Subtle bitmap grid inside circle ===
ctx.save();
ctx.beginPath();
ctx.arc(cx, cy, 174, 0, Math.PI * 2);
ctx.clip();

// Mondrian-style blocks
const blocks = [];
const gridSize = 174;
const startX = cx - gridSize;
const startY = cy - gridSize;
const cellSize = 22;

// Generate natural-looking bitmap blocks
const sizes = [1,1,1,1,1,1,1,2,2,2,3,4];
for (let attempt = 0; attempt < 200; attempt++) {
  const s = sizes[Math.floor(Math.random() * sizes.length)];
  const gx = Math.floor(Math.random() * (gridSize * 2 / cellSize - s));
  const gy = Math.floor(Math.random() * (gridSize * 2 / cellSize - s));
  const bx = startX + gx * cellSize;
  const by = startY + gy * cellSize;
  const bw = s * cellSize - 2;
  const bh = s * cellSize - 2;
  
  // Check distance from center — fade out near edges
  const bdist = Math.sqrt((bx + bw/2 - cx)**2 + (by + bh/2 - cy)**2);
  if (bdist > 160) continue;
  
  const alpha = 0.03 + (1 - bdist / 160) * 0.06;
  ctx.fillStyle = `rgba(247,147,26,${alpha})`;
  ctx.fillRect(bx, by, bw, bh);
}
ctx.restore();

// === DNA DOUBLE HELIX — Compact, iconic, wrapping the ₿ ===
function drawCompactHelix(offsetAngle, startY, endY, radius, color, glowColor) {
  const points = 80;
  
  // Draw strand
  ctx.beginPath();
  for (let i = 0; i <= points; i++) {
    const t = i / points;
    const y = startY + t * (endY - startY);
    const angle = t * Math.PI * 4 + offsetAngle;
    const x = cx + Math.cos(angle) * radius;
    const depth = Math.sin(angle);
    
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  
  // Glow
  ctx.strokeStyle = glowColor;
  ctx.lineWidth = 6;
  ctx.stroke();
  
  // Main line
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.stroke();
}

// Left helix pair
drawCompactHelix(0, cy - 150, cy + 150, 80, 'rgba(247,147,26,0.5)', 'rgba(247,147,26,0.1)');
drawCompactHelix(Math.PI, cy - 150, cy + 150, 80, 'rgba(0,200,255,0.4)', 'rgba(0,200,255,0.08)');

// Base pair connections
for (let i = 0; i < 12; i++) {
  const t = (i + 0.5) / 12;
  const y = (cy - 150) + t * 300;
  const angle = t * Math.PI * 4;
  const x1 = cx + Math.cos(angle) * 80;
  const x2 = cx + Math.cos(angle + Math.PI) * 80;
  
  ctx.beginPath();
  ctx.moveTo(x1, y);
  ctx.lineTo(x2, y);
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  ctx.stroke();
  
  // Nucleotide dots
  const midX = (x1 + x2) / 2;
  ctx.beginPath();
  ctx.arc(x1, y, 2, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(247,147,26,0.3)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x2, y, 2, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,200,255,0.25)';
  ctx.fill();
}

// === ₿ SYMBOL — Bold, centered, premium ===
ctx.font = '900 200px -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';

// Multi-layer glow
[40, 25, 15].forEach((blur, i) => {
  ctx.shadowColor = '#f7931a';
  ctx.shadowBlur = blur;
  ctx.fillStyle = `rgba(247,147,26,${0.08 + i * 0.04})`;
  ctx.fillText('₿', cx, cy + 4);
});
ctx.shadowBlur = 0;

// Main ₿ — crisp gradient
const btcGrad = ctx.createLinearGradient(cx, cy - 100, cx, cy + 100);
btcGrad.addColorStop(0, '#FFD700');
btcGrad.addColorStop(0.25, '#F7931A');
btcGrad.addColorStop(0.75, '#F7931A');
btcGrad.addColorStop(1, '#FFB347');
ctx.fillStyle = btcGrad;
ctx.fillText('₿', cx, cy + 4);

// Thin highlight edge
ctx.strokeStyle = 'rgba(255,215,0,0.25)';
ctx.lineWidth = 1;
ctx.strokeText('₿', cx, cy + 4);

// === "BG" MONOGRAM — Bottom, subtle ===
// Actually skip this per Gravity's preference (no BG icon)

// === SMALL CROWN — Top of circle, minimal ===
const crownY = cy - 185;
const crownW = 40;
const crownH = 20;

ctx.beginPath();
ctx.moveTo(cx - crownW/2, crownY + crownH);
ctx.lineTo(cx - crownW/2, crownY + crownH * 0.35);
ctx.lineTo(cx - crownW/4, crownY + crownH * 0.55);
ctx.lineTo(cx, crownY);
ctx.lineTo(cx + crownW/4, crownY + crownH * 0.55);
ctx.lineTo(cx + crownW/2, crownY + crownH * 0.35);
ctx.lineTo(cx + crownW/2, crownY + crownH);
ctx.closePath();

const crGrad = ctx.createLinearGradient(cx, crownY, cx, crownY + crownH);
crGrad.addColorStop(0, '#FFD700');
crGrad.addColorStop(1, '#F7931A');
ctx.fillStyle = crGrad;
ctx.fill();

// Crown glow
ctx.shadowColor = '#ffd700';
ctx.shadowBlur = 12;
ctx.fill();
ctx.shadowBlur = 0;

// Jewel dots on crown tips
[[-crownW/2, crownH*0.35], [0, 0], [crownW/2, crownH*0.35]].forEach(([ox, oy], i) => {
  ctx.beginPath();
  ctx.arc(cx + ox, crownY + oy, 2.5, 0, Math.PI * 2);
  ctx.fillStyle = i === 1 ? '#00ffcc' : '#fff';
  ctx.shadowColor = i === 1 ? '#00ffcc' : '#ffd700';
  ctx.shadowBlur = 6;
  ctx.fill();
  ctx.shadowBlur = 0;
});

// === GREEN VERIFIED DOT — Clean, bottom-right ===
const vx = cx + 135, vy = cy + 135;

// Glow
ctx.beginPath();
ctx.arc(vx, vy, 18, 0, Math.PI * 2);
ctx.fillStyle = 'rgba(0,255,136,0.15)';
ctx.fill();

// White ring (like Twitter verified)
ctx.beginPath();
ctx.arc(vx, vy, 15, 0, Math.PI * 2);
ctx.fillStyle = '#00ff88';
ctx.shadowColor = '#00ff88';
ctx.shadowBlur = 15;
ctx.fill();
ctx.shadowBlur = 0;

// Check mark
ctx.beginPath();
ctx.moveTo(vx - 6, vy);
ctx.lineTo(vx - 1, vy + 5);
ctx.lineTo(vx + 7, vy - 5);
ctx.strokeStyle = '#000';
ctx.lineWidth = 3;
ctx.lineCap = 'round';
ctx.lineJoin = 'round';
ctx.stroke();
</script>
</body>
</html>
