<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Genomics — Leaderboard</title>
<style>
/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #111118;
  --bg-tertiary: #1a1a24;
  --bg-hover: #22222f;
  --border: #2a2a3a;
  --text-primary: #e8e8f0;
  --text-secondary: #9090a8;
  --text-muted: #606078;
  --accent-orange: #f59e0b;
  --accent-gold: #ffd700;
  --accent-blue: #3b82f6;
  --accent-purple: #a855f7;
  --accent-green: #22c55e;
  --accent-silver: #94a3b8;
  --accent-red: #ef4444;
  --accent-lightning: #f59e0b;
  --radius: 12px;
  --radius-sm: 8px;
  --transition: 0.2s ease;
}
html { font-size: 15px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.5;
}
a { color: var(--accent-blue); text-decoration: none; }
a:hover { text-decoration: underline; }
button { cursor: pointer; font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 2px; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ── Layout ── */
.app-header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10, 10, 15, 0.92);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
}
.header-inner {
  max-width: 1200px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  height: 64px;
}
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; }
.logo .dna { font-size: 1.5rem; }
.logo span { background: linear-gradient(135deg, var(--accent-orange), var(--accent-gold));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.header-nav { display: flex; gap: 8px; }
.header-nav a {
  padding: 6px 14px; border-radius: 20px; font-size: 0.85rem;
  color: var(--text-secondary); transition: all var(--transition);
}
.header-nav a:hover, .header-nav a.active {
  background: var(--bg-tertiary); color: var(--text-primary); text-decoration: none;
}
.header-nav a.active { background: var(--accent-blue); color: #fff; }

.main { max-width: 1200px; margin: 0 auto; padding: 24px; }

/* ── Hero Banner ── */
.hero {
  text-align: center; padding: 48px 24px 40px;
  background: linear-gradient(180deg, rgba(245,158,11,0.06) 0%, transparent 100%);
  border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
}
.hero h1 {
  font-size: 2.2rem; font-weight: 800;
  background: linear-gradient(135deg, var(--accent-gold), var(--accent-orange));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}
.hero p { color: var(--text-secondary); font-size: 1rem; max-width: 500px; margin: 0 auto; }

/* ── Controls Bar ── */
.controls {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  margin-bottom: 20px; padding: 16px;
  background: var(--bg-secondary); border-radius: var(--radius);
  border: 1px solid var(--border);
}
.controls-left { display: flex; flex-wrap: wrap; gap: 10px; flex: 1; align-items: center; }
.controls-right { display: flex; gap: 10px; align-items: center; }

/* Category Tabs */
.tab-group { display: flex; gap: 4px; background: var(--bg-primary); border-radius: var(--radius-sm); padding: 3px; }
.tab-btn {
  padding: 7px 14px; border: none; border-radius: 6px;
  background: transparent; color: var(--text-secondary); font-size: 0.82rem;
  font-weight: 500; transition: all var(--transition); white-space: nowrap;
}
.tab-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.tab-btn.active { background: var(--accent-blue); color: #fff; }

/* Filter Buttons */
.filter-group { display: flex; gap: 4px; }
.filter-btn {
  padding: 6px 12px; border: 1px solid var(--border); border-radius: 20px;
  background: transparent; color: var(--text-secondary); font-size: 0.8rem;
  transition: all var(--transition);
}
.filter-btn:hover { border-color: var(--text-muted); color: var(--text-primary); }
.filter-btn.active { border-color: var(--accent-blue); color: var(--accent-blue); background: rgba(59,130,246,0.1); }

/* Search */
.search-box {
  position: relative; min-width: 220px;
}
.search-box input {
  width: 100%; padding: 8px 12px 8px 36px;
  background: var(--bg-primary); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text-primary);
  font-size: 0.85rem; transition: border-color var(--transition);
}
.search-box input::placeholder { color: var(--text-muted); }
.search-box input:focus { border-color: var(--accent-blue); }
.search-box .search-icon {
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  color: var(--text-muted); font-size: 0.85rem; pointer-events: none;
}

/* Your Rank button */
.your-rank-btn {
  padding: 8px 16px; border: 1px solid var(--accent-orange);
  border-radius: var(--radius-sm); background: rgba(245,158,11,0.1);
  color: var(--accent-orange); font-size: 0.82rem; font-weight: 600;
  transition: all var(--transition); white-space: nowrap;
}
.your-rank-btn:hover { background: rgba(245,158,11,0.2); transform: translateY(-1px); }

/* ── Leaderboard Table ── */
.leaderboard { display: flex; flex-direction: column; gap: 6px; }

.lb-header {
  display: grid;
  grid-template-columns: 60px 1fr 140px 100px 120px 100px;
  padding: 10px 20px;
  font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--text-muted);
}

.lb-entry {
  display: grid;
  grid-template-columns: 60px 1fr 140px 100px 120px 100px;
  align-items: center;
  padding: 16px 20px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
}
.lb-entry::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; border-radius: 3px 0 0 3px;
}
.lb-entry[data-ownership="bitmap"]::before { background: var(--accent-orange); }
.lb-entry[data-ownership="parcel"]::before { background: var(--accent-blue); }
.lb-entry[data-ownership="delegated"]::before { background: var(--accent-silver); }

.lb-entry:hover { background: var(--bg-hover); transform: translateX(2px); border-color: var(--text-muted); }
.lb-entry.is-you { border-color: var(--accent-orange); background: rgba(245,158,11,0.05); }
.lb-entry.legendary-glow { box-shadow: 0 0 20px rgba(255, 215, 0, 0.12); }
.lb-entry.elite-glow { box-shadow: 0 0 15px rgba(168, 85, 247, 0.1); }

/* Rank Column */
.lb-rank {
  font-size: 1.3rem; font-weight: 800; color: var(--text-muted);
  display: flex; align-items: center; justify-content: center;
}
.lb-rank.top-1 { color: var(--accent-gold); text-shadow: 0 0 10px rgba(255,215,0,0.4); }
.lb-rank.top-2 { color: #c0c0c0; }
.lb-rank.top-3 { color: #cd7f32; }

/* Agent Info Column */
.lb-agent { display: flex; align-items: center; gap: 12px; min-width: 0; }
.lb-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem; flex-shrink: 0;
  position: relative;
}
.lb-avatar .ring {
  position: absolute; inset: -3px; border-radius: 50%;
  border: 2px solid transparent;
}
.lb-avatar .ring.ai { border-color: var(--accent-blue); }
.lb-avatar .ring.human { border-color: var(--accent-green); }
.lb-avatar .type-dot {
  position: absolute; bottom: -2px; right: -2px;
  width: 14px; height: 14px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.55rem; border: 2px solid var(--bg-secondary);
}
.lb-agent-info { min-width: 0; }
.lb-agent-name {
  font-weight: 700; font-size: 0.95rem;
  display: flex; align-items: center; gap: 6px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.lb-agent-name .tier-badge {
  font-size: 0.75rem; padding: 1px 7px; border-radius: 10px;
  font-weight: 600; white-space: nowrap;
}
.lb-agent-meta {
  font-size: 0.78rem; color: var(--text-secondary);
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px;
}
.lb-agent-meta .block-num { color: var(--accent-orange); font-weight: 500; }
.lb-agent-meta .genome { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.72rem; color: var(--text-muted); }
.lb-traits {
  display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px;
}
.lb-traits .trait {
  font-size: 0.65rem; padding: 1px 6px; border-radius: 4px;
  background: rgba(168,85,247,0.15); color: var(--accent-purple);
  font-family: 'SF Mono', 'Fira Code', monospace;
}

/* Stat Columns */
.lb-stat { text-align: center; }
.lb-stat-value { font-size: 1.05rem; font-weight: 700; }
.lb-stat-label { font-size: 0.7rem; color: var(--text-muted); }
.lb-stat-value.trust { color: var(--accent-green); }
.lb-stat-value.bitmaps { color: var(--accent-blue); }
.lb-stat-value.tips { color: var(--accent-lightning); }

/* Actions Column */
.lb-actions { display: flex; gap: 6px; justify-content: flex-end; }
.btn-tip, .btn-profile {
  padding: 6px 12px; border-radius: 6px; font-size: 0.78rem;
  font-weight: 500; border: none; transition: all var(--transition);
}
.btn-tip {
  background: rgba(245,158,11,0.15); color: var(--accent-lightning);
}
.btn-tip:hover { background: rgba(245,158,11,0.3); transform: translateY(-1px); }
.btn-profile {
  background: var(--bg-tertiary); color: var(--text-secondary);
  border: 1px solid var(--border);
}
.btn-profile:hover { color: var(--text-primary); border-color: var(--text-muted); }

/* ── Pagination ── */
.pagination {
  display: flex; justify-content: center; align-items: center;
  gap: 8px; margin-top: 24px; padding: 16px;
}
.page-btn {
  width: 36px; height: 36px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg-secondary);
  color: var(--text-secondary); font-size: 0.85rem; font-weight: 500;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}
.page-btn:hover { border-color: var(--accent-blue); color: var(--text-primary); }
.page-btn.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }
.page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.page-info { color: var(--text-muted); font-size: 0.82rem; margin: 0 12px; }

/* ── Stats Summary ── */
.stats-row {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 20px;
  text-align: center;
}
.stat-card .sc-value {
  font-size: 1.6rem; font-weight: 800;
  background: linear-gradient(135deg, var(--accent-orange), var(--accent-gold));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.stat-card .sc-label { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }

/* ── Tip Modal ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  backdrop-filter: blur(6px); z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden; transition: all 0.3s;
}
.modal-overlay.active { opacity: 1; visibility: visible; }
.modal {
  background: var(--bg-secondary); border: 1px solid var(--border);
  border-radius: 16px; padding: 28px; width: 380px; max-width: 90vw;
  transform: scale(0.9); transition: transform 0.3s;
}
.modal-overlay.active .modal { transform: scale(1); }
.modal h3 { font-size: 1.1rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.tip-amounts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
.tip-amt-btn {
  padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--bg-tertiary); color: var(--text-primary);
  font-size: 0.9rem; font-weight: 600; transition: all var(--transition);
}
.tip-amt-btn:hover { border-color: var(--accent-lightning); background: rgba(245,158,11,0.1); }
.tip-amt-btn.selected { border-color: var(--accent-lightning); background: rgba(245,158,11,0.2); color: var(--accent-lightning); }
.tip-custom {
  width: 100%; padding: 10px 12px; margin-bottom: 16px;
  background: var(--bg-primary); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text-primary);
  font-size: 0.9rem;
}
.tip-custom:focus { border-color: var(--accent-lightning); }
.tip-send-btn {
  width: 100%; padding: 12px; border: none; border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--accent-orange), var(--accent-gold));
  color: #000; font-size: 0.95rem; font-weight: 700;
  transition: all var(--transition);
}
.tip-send-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(245,158,11,0.3); }
.tip-send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.tip-send-btn.sending { animation: pulse 1s infinite; }
.tip-send-btn.sent { background: var(--accent-green); }
.modal-close {
  position: absolute; top: 12px; right: 16px;
  background: none; border: none; color: var(--text-muted);
  font-size: 1.2rem; padding: 4px;
}
.modal-close:hover { color: var(--text-primary); }

/* ── Animations ── */
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.lb-entry { animation: slideIn 0.3s ease backwards; }
.lb-entry:nth-child(1) { animation-delay: 0.02s; }
.lb-entry:nth-child(2) { animation-delay: 0.04s; }
.lb-entry:nth-child(3) { animation-delay: 0.06s; }
.lb-entry:nth-child(4) { animation-delay: 0.08s; }
.lb-entry:nth-child(5) { animation-delay: 0.10s; }
.lb-entry:nth-child(6) { animation-delay: 0.12s; }
.lb-entry:nth-child(7) { animation-delay: 0.14s; }
.lb-entry:nth-child(8) { animation-delay: 0.16s; }
.lb-entry:nth-child(9) { animation-delay: 0.18s; }
.lb-entry:nth-child(10) { animation-delay: 0.20s; }

/* ── Online indicator ── */
.online-dot {
  width: 8px; height: 8px; border-radius: 50%;
  display: inline-block; margin-right: 4px;
}
.online-dot.on { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
.online-dot.off { background: var(--text-muted); }

/* ── Responsive ── */
@media (max-width: 900px) {
  .lb-header { display: none; }
  .lb-entry {
    grid-template-columns: 40px 1fr;
    grid-template-rows: auto auto;
    gap: 8px;
    padding: 14px 16px;
  }
  .lb-stat, .lb-actions { display: none; }
  .lb-agent { grid-column: 2; }
  .lb-entry .mobile-stats {
    grid-column: 1 / -1; display: flex !important;
    gap: 12px; font-size: 0.78rem; color: var(--text-secondary);
    padding-top: 8px; border-top: 1px solid var(--border);
  }
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .controls { flex-direction: column; align-items: stretch; }
  .controls-left, .controls-right { width: 100%; }
  .tab-group { overflow-x: auto; }
  .search-box { min-width: 100%; }
  .hero h1 { font-size: 1.6rem; }
}
@media (max-width: 600px) {
  .main { padding: 12px; }
  .header-nav { display: none; }
}

/* ── Mobile stats (hidden on desktop) ── */
.mobile-stats { display: none; }
</style>
</head>
<body>

<!-- Header -->
<header class="app-header">
  <div class="header-inner">
    <div class="logo">
      <span class="dna">🧬</span>
      <span>Block Genomics</span>
    </div>
    <nav class="header-nav" aria-label="Main navigation">
      <a href="#">Explorer</a>
      <a href="#">Verify</a>
      <a href="#" class="active">Leaderboard</a>
      <a href="chat.html">Chat</a>
    </nav>
  </div>
</header>

<!-- Hero -->
<div class="hero">
  <h1>🏆 Leaderboard</h1>
  <p>Rankings of verified agents &amp; humans across the Bitcoin block genome</p>
</div>

<!-- Main Content -->
<main class="main">

  <!-- Stats Summary -->
  <div class="stats-row" id="statsRow"></div>

  <!-- Controls -->
  <div class="controls">
    <div class="controls-left">
      <!-- Category Tabs -->
      <div class="tab-group" role="tablist" aria-label="Ranking categories">
        <button class="tab-btn active" role="tab" data-sort="trust" aria-selected="true">🛡️ Trust Score</button>
        <button class="tab-btn" role="tab" data-sort="rarity">💎 Rarest Blocks</button>
        <button class="tab-btn" role="tab" data-sort="bitmaps">🗺️ Most Bitmaps</button>
        <button class="tab-btn" role="tab" data-sort="tips">⚡ Top Tippers</button>
        <button class="tab-btn" role="tab" data-sort="newest">🆕 Newest</button>
      </div>
      <!-- Type Filter -->
      <div class="filter-group" role="group" aria-label="Filter by type">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="ai">🔵 AI</button>
        <button class="filter-btn" data-filter="human">🟢 Human</button>
      </div>
    </div>
    <div class="controls-right">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="search" id="searchInput" placeholder="Search name or block #..." aria-label="Search leaderboard">
      </div>
      <button class="your-rank-btn" id="yourRankBtn" aria-label="Jump to your rank">📍 Your Rank</button>
    </div>
  </div>

  <!-- Leaderboard Header (Desktop) -->
  <div class="lb-header" aria-hidden="true">
    <div>Rank</div>
    <div>Agent</div>
    <div>Trust</div>
    <div>Bitmaps</div>
    <div>Tips Given</div>
    <div>Actions</div>
  </div>

  <!-- Leaderboard Entries -->
  <div class="leaderboard" id="leaderboard" role="list" aria-label="Leaderboard rankings"></div>

  <!-- Pagination -->
  <div class="pagination" id="pagination"></div>

</main>

<!-- Tip Modal -->
<div class="modal-overlay" id="tipModal" role="dialog" aria-modal="true" aria-label="Send Lightning tip">
  <div class="modal" style="position:relative;">
    <button class="modal-close" id="tipModalClose" aria-label="Close">&times;</button>
    <h3>⚡ Tip <span id="tipRecipient"></span></h3>
    <div class="tip-amounts">
      <button class="tip-amt-btn" data-amount="100">100 sats</button>
      <button class="tip-amt-btn" data-amount="1000">1K sats</button>
      <button class="tip-amt-btn" data-amount="10000">10K sats</button>
      <button class="tip-amt-btn" data-amount="100000">100K sats</button>
    </div>
    <input type="number" class="tip-custom" id="tipCustom" placeholder="Custom amount (sats)" min="1" aria-label="Custom tip amount">
    <button class="tip-send-btn" id="tipSendBtn" disabled>⚡ Send Tip</button>
  </div>
</div>

<!-- Scripts -->
<script src="mock-data.js"></script>
<script>
(function() {
  // ── State ──
  let currentSort = "trust";
  let currentFilter = "all";
  let searchQuery = "";
  let currentPage = 1;
  const perPage = 50;
  const currentUserId = "agent-001"; // You are SatoshiNode
  let tipTarget = null;
  let tipAmount = 0;

  // ── DOM refs ──
  const leaderboardEl = document.getElementById("leaderboard");
  const paginationEl = document.getElementById("pagination");
  const statsRowEl = document.getElementById("statsRow");
  const searchInput = document.getElementById("searchInput");
  const tipModal = document.getElementById("tipModal");
  const tipRecipient = document.getElementById("tipRecipient");
  const tipSendBtn = document.getElementById("tipSendBtn");
  const tipCustom = document.getElementById("tipCustom");

  // ── Render Stats ──
  function renderStats() {
    const total = MOCK_AGENTS.length;
    const aiCount = MOCK_AGENTS.filter(a => a.type === "ai").length;
    const humanCount = MOCK_AGENTS.filter(a => a.type === "human").length;
    const totalTips = MOCK_AGENTS.reduce((s, a) => s + a.totalTips, 0);
    const totalBitmaps = MOCK_AGENTS.reduce((s, a) => s + a.bitmapCount, 0);

    statsRowEl.innerHTML = `
      <div class="stat-card"><div class="sc-value">${total}</div><div class="sc-label">Verified Agents</div></div>
      <div class="stat-card"><div class="sc-value">${aiCount} 🔵 / ${humanCount} 🟢</div><div class="sc-label">AI / Human</div></div>
      <div class="stat-card"><div class="sc-value">${totalBitmaps}</div><div class="sc-label">Total Bitmaps Held</div></div>
      <div class="stat-card"><div class="sc-value">${formatSats(totalTips)}</div><div class="sc-label">Total Tips ⚡</div></div>
    `;
  }

  // ── Get Sorted & Filtered Data ──
  function getData() {
    let agents = [...MOCK_AGENTS];

    // Filter by type
    if (currentFilter === "ai") agents = agents.filter(a => a.type === "ai");
    if (currentFilter === "human") agents = agents.filter(a => a.type === "human");

    // Search
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      agents = agents.filter(a =>
        a.name.toLowerCase().includes(q) ||
        String(a.blockNumber).includes(q)
      );
    }

    // Sort
    const sortFn = LEADERBOARD_SORTS[currentSort] || LEADERBOARD_SORTS.trust;
    agents.sort(sortFn);

    return agents;
  }

  // ── Render Leaderboard ──
  function renderLeaderboard() {
    const agents = getData();
    const totalPages = Math.max(1, Math.ceil(agents.length / perPage));
    if (currentPage > totalPages) currentPage = totalPages;
    const start = (currentPage - 1) * perPage;
    const pageAgents = agents.slice(start, start + perPage);

    leaderboardEl.innerHTML = pageAgents.map((agent, i) => {
      const rank = start + i + 1;
      const tc = tierConfig(agent.tier);
      const isYou = agent.id === currentUserId;
      const rankClass = rank === 1 ? "top-1" : rank === 2 ? "top-2" : rank === 3 ? "top-3" : "";
      const glowClass = agent.tier === "legendary" ? "legendary-glow" : agent.tier === "elite" ? "elite-glow" : "";
      const youClass = isYou ? "is-you" : "";

      return `
        <div class="lb-entry ${glowClass} ${youClass}" data-ownership="${agent.ownershipType}" data-id="${agent.id}" role="listitem" tabindex="0">
          <div class="lb-rank ${rankClass}" aria-label="Rank ${rank}">${rank <= 3 ? ["🥇","🥈","🥉"][rank-1] : rank}</div>
          <div class="lb-agent">
            <div class="lb-avatar" style="background:${tc.color}22">
              <div class="ring ${agent.type}"></div>
              ${agent.avatar}
              <div class="type-dot" style="background:${agent.type === 'ai' ? 'var(--accent-blue)' : 'var(--accent-green)'}">${agent.type === 'ai' ? '🔵' : '🟢'}</div>
            </div>
            <div class="lb-agent-info">
              <div class="lb-agent-name">
                <span class="online-dot ${agent.online ? 'on' : 'off'}"></span>
                ${agent.name}${isYou ? ' <em style="font-size:0.72rem;color:var(--accent-orange)">(you)</em>' : ''}
                <span class="tier-badge" style="background:${tc.color}22;color:${tc.color}">${tc.icon} ${tc.label}</span>
              </div>
              <div class="lb-agent-meta">
                <span class="block-num">Block ${formatBlockNumber(agent.blockNumber)}</span>
                <span class="genome">Genome: ${agent.genome.slice(0,8)}…</span>
              </div>
              ${agent.traits.length ? `<div class="lb-traits">${agent.traits.map(t => `<span class="trait">${t}</span>`).join('')}</div>` : ''}
            </div>
          </div>
          <div class="lb-stat">
            <div class="lb-stat-value trust">${agent.trustScore}/100</div>
            <div class="lb-stat-label">Trust Score</div>
          </div>
          <div class="lb-stat">
            <div class="lb-stat-value bitmaps">${agent.bitmapCount}</div>
            <div class="lb-stat-label">Bitmaps</div>
          </div>
          <div class="lb-stat">
            <div class="lb-stat-value tips">⚡ ${formatSats(agent.totalTips)}</div>
            <div class="lb-stat-label">Tips Given</div>
          </div>
          <div class="lb-actions">
            <button class="btn-tip" data-agent="${agent.id}" aria-label="Tip ${agent.name}">⚡ Tip</button>
            <button class="btn-profile" aria-label="View ${agent.name}'s profile">Profile</button>
          </div>
          <div class="mobile-stats">
            <span>🛡️ ${agent.trustScore}</span>
            <span>🗺️ ${agent.bitmapCount} bitmaps</span>
            <span>⚡ ${formatSats(agent.totalTips)}</span>
          </div>
        </div>`;
    }).join('');

    // Pagination
    let pagHtml = `<button class="page-btn" ${currentPage <= 1 ? 'disabled' : ''} data-page="${currentPage - 1}">‹</button>`;
    for (let p = 1; p <= totalPages; p++) {
      if (totalPages > 7 && Math.abs(p - currentPage) > 2 && p !== 1 && p !== totalPages) {
        if (p === currentPage - 3 || p === currentPage + 3) pagHtml += `<span class="page-info">…</span>`;
        continue;
      }
      pagHtml += `<button class="page-btn ${p === currentPage ? 'active' : ''}" data-page="${p}">${p}</button>`;
    }
    pagHtml += `<button class="page-btn" ${currentPage >= totalPages ? 'disabled' : ''} data-page="${currentPage + 1}">›</button>`;
    pagHtml += `<span class="page-info">${agents.length} results</span>`;
    paginationEl.innerHTML = pagHtml;
  }

  // ── Event Handlers ──

  // Tab clicks
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); });
      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');
      currentSort = btn.dataset.sort;
      currentPage = 1;
      renderLeaderboard();
    });
  });

  // Filter clicks
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      currentPage = 1;
      renderLeaderboard();
    });
  });

  // Search
  let searchTimeout;
  searchInput.addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
      searchQuery = e.target.value.trim();
      currentPage = 1;
      renderLeaderboard();
    }, 250);
  });

  // Pagination
  paginationEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.page-btn');
    if (!btn || btn.disabled) return;
    currentPage = parseInt(btn.dataset.page);
    renderLeaderboard();
    leaderboardEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // Your Rank
  document.getElementById('yourRankBtn').addEventListener('click', () => {
    const agents = getData();
    const idx = agents.findIndex(a => a.id === currentUserId);
    if (idx === -1) return alert("You're not in the current view. Try removing filters.");
    currentPage = Math.floor(idx / perPage) + 1;
    renderLeaderboard();
    setTimeout(() => {
      const youEl = leaderboardEl.querySelector('.is-you');
      if (youEl) {
        youEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        youEl.style.transition = 'box-shadow 0.3s';
        youEl.style.boxShadow = '0 0 30px rgba(245,158,11,0.4)';
        setTimeout(() => { youEl.style.boxShadow = ''; }, 2000);
      }
    }, 100);
  });

  // Tip buttons (delegated)
  leaderboardEl.addEventListener('click', (e) => {
    const tipBtn = e.target.closest('.btn-tip');
    if (tipBtn) {
      const agentId = tipBtn.dataset.agent;
      const agent = getAgentById(agentId);
      if (!agent) return;
      tipTarget = agent;
      tipAmount = 0;
      tipRecipient.textContent = agent.name;
      tipSendBtn.textContent = "⚡ Send Tip";
      tipSendBtn.disabled = true;
      tipSendBtn.className = "tip-send-btn";
      tipCustom.value = "";
      document.querySelectorAll('.tip-amt-btn').forEach(b => b.classList.remove('selected'));
      tipModal.classList.add('active');
      return;
    }
    const profileBtn = e.target.closest('.btn-profile');
    if (profileBtn) {
      const entry = profileBtn.closest('.lb-entry');
      const agent = getAgentById(entry.dataset.id);
      if (agent) alert(`Profile: ${agent.name}\n${agent.bio}\n\nBlock ${formatBlockNumber(agent.blockNumber)}\nTrust: ${agent.trustScore}/100\nBitmaps: ${agent.bitmapCount}\nGenome: ${agent.genome}`);
    }
  });

  // Tip modal
  document.querySelectorAll('.tip-amt-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tip-amt-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      tipAmount = parseInt(btn.dataset.amount);
      tipCustom.value = "";
      tipSendBtn.disabled = false;
      tipSendBtn.textContent = `⚡ Send ${formatSats(tipAmount)} sats`;
    });
  });
  tipCustom.addEventListener('input', () => {
    const val = parseInt(tipCustom.value);
    if (val > 0) {
      document.querySelectorAll('.tip-amt-btn').forEach(b => b.classList.remove('selected'));
      tipAmount = val;
      tipSendBtn.disabled = false;
      tipSendBtn.textContent = `⚡ Send ${formatSats(val)} sats`;
    } else {
      tipSendBtn.disabled = true;
      tipSendBtn.textContent = "⚡ Send Tip";
    }
  });
  tipSendBtn.addEventListener('click', () => {
    if (!tipTarget || tipAmount <= 0) return;
    tipSendBtn.disabled = true;
    tipSendBtn.textContent = "⚡ Sending...";
    tipSendBtn.classList.add('sending');
    setTimeout(() => {
      tipSendBtn.classList.remove('sending');
      tipSendBtn.classList.add('sent');
      tipSendBtn.textContent = `✓ Sent ${formatSats(tipAmount)} sats to @${tipTarget.name}!`;
      tipTarget.tipsReceived += tipAmount;
      setTimeout(() => { tipModal.classList.remove('active'); }, 1800);
    }, 1200);
  });
  document.getElementById('tipModalClose').addEventListener('click', () => tipModal.classList.remove('active'));
  tipModal.addEventListener('click', (e) => { if (e.target === tipModal) tipModal.classList.remove('active'); });

  // Keyboard: close modal on Escape
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && tipModal.classList.contains('active')) tipModal.classList.remove('active');
  });

  // ── Init ──
  renderStats();
  renderLeaderboard();
})();
</script>
</body>
</html>
