<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Genomics Monitor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e17;--card:#111827;--card-hover:#1a2332;--border:#1e293b;--text:#e2e8f0;--text-dim:#64748b;--orange:#f59e0b;--cyan:#06b6d4;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--purple:#a855f7}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
a{color:var(--cyan);text-decoration:none}a:hover{text-decoration:underline}

/* Header */
.header{background:linear-gradient(135deg,#0f172a,#1e1b4b);border-bottom:1px solid var(--border);padding:1.5rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.header-left{display:flex;align-items:center;gap:1rem}
.shield{width:48px;height:48px;background:linear-gradient(135deg,var(--orange),var(--cyan));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;color:#000}
.header h1{font-size:1.5rem;font-weight:700;background:linear-gradient(90deg,var(--orange),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-sub{font-size:.8rem;color:var(--text-dim)}
.header-right{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.refresh-interval{background:var(--card);border:1px solid var(--border);color:var(--text);padding:.4rem .6rem;border-radius:6px;font-size:.8rem}
.refresh-interval option{background:var(--card)}
.btn{padding:.5rem 1.2rem;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:.85rem;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--orange),#d97706);color:#000}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(245,158,11,.3)}
.btn-primary:active{transform:translateY(0)}
.btn-primary.checking{opacity:.7;pointer-events:none}
#lastCheck{font-size:.75rem;color:var(--text-dim)}

/* Global Status Bar */
.global-bar{display:flex;gap:1.5rem;padding:1rem 2rem;background:#0d1321;border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
.global-stat{display:flex;align-items:center;gap:.5rem;font-size:.85rem}
.global-stat .label{color:var(--text-dim)}
.global-stat .value{font-weight:700}
.uptime-good{color:var(--green)}.uptime-warn{color:var(--yellow)}.uptime-bad{color:var(--red)}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.25rem;padding:2rem;max-width:1400px;margin:0 auto}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:all .3s}
.card:hover{border-color:#334155;background:var(--card-hover)}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;cursor:pointer;user-select:none}
.card-title{display:flex;align-items:center;gap:.6rem;font-weight:600;font-size:.95rem}
.card-icon{font-size:1.2rem}
.status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;transition:background .5s}
.status-dot.online{background:var(--green);box-shadow:0 0 8px var(--green)}
.status-dot.degraded{background:var(--yellow);box-shadow:0 0 8px var(--yellow)}
.status-dot.down{background:var(--red);box-shadow:0 0 8px var(--red)}
.status-dot.unknown{background:var(--text-dim)}
.status-dot.checking{animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.card-meta{font-size:.75rem;color:var(--text-dim)}
.card-body{padding:0 1.25rem 1.25rem;display:none}
.card.expanded .card-body{display:block}
.card-body .row{display:flex;justify-content:space-between;padding:.35rem 0;border-bottom:1px solid #1e293b20;font-size:.85rem}
.card-body .row:last-child{border:none}
.card-body .row .k{color:var(--text-dim)}.card-body .row .v{font-weight:500;text-align:right;max-width:60%;word-break:break-all}
.card-body .error-msg{color:var(--red);font-size:.8rem;padding:.5rem 0}
.resp-time{font-size:.75rem;color:var(--cyan);font-weight:600}

/* Graph Section */
.graph-section{padding:0 2rem 2rem;max-width:1400px;margin:0 auto}
.graph-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.5rem}
.graph-card h3{font-size:1rem;margin-bottom:1rem;color:var(--text-dim)}
.graph-container{position:relative;height:160px;display:flex;align-items:flex-end;gap:3px}
.graph-bar{flex:1;min-width:6px;border-radius:3px 3px 0 0;transition:height .5s;position:relative;cursor:pointer}
.graph-bar:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:2px 8px;border-radius:4px;font-size:.7rem;white-space:nowrap;z-index:10}
.graph-bar.ok{background:linear-gradient(to top,#065f46,var(--green))}
.graph-bar.slow{background:linear-gradient(to top,#713f12,var(--yellow))}
.graph-bar.fail{background:linear-gradient(to top,#7f1d1d,var(--red))}
.graph-labels{display:flex;justify-content:space-between;margin-top:.5rem;font-size:.65rem;color:var(--text-dim)}

/* Footer */
.footer{text-align:center;padding:2rem;color:var(--text-dim);font-size:.8rem;border-top:1px solid var(--border)}

/* Mobile */
@media(max-width:600px){.header{padding:1rem}.grid{padding:1rem;grid-template-columns:1fr}.graph-section{padding:0 1rem 1rem}}

/* Expand chevron */
.chevron{transition:transform .2s;font-size:.7rem;color:var(--text-dim)}
.card.expanded .chevron{transform:rotate(180deg)}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="shield">👑</div>
    <div>
      <h1>Block Genomics Monitor</h1>
      <div class="header-sub">Real-time platform health dashboard</div>
    </div>
  </div>
  <div class="header-right">
    <span id="lastCheck">Never checked</span>
    <select class="refresh-interval" id="intervalSelect" title="Auto-refresh interval">
      <option value="30">30s</option>
      <option value="60" selected>60s</option>
      <option value="120">2m</option>
      <option value="300">5m</option>
      <option value="0">Off</option>
    </select>
    <button class="btn btn-primary" id="checkBtn" onclick="runAllChecks()">⚡ Check Now</button>
  </div>
</div>

<div class="global-bar">
  <div class="global-stat"><span class="label">Services:</span><span class="value" id="gServices">—</span></div>
  <div class="global-stat"><span class="label">Uptime (24h):</span><span class="value" id="gUptime">—</span></div>
  <div class="global-stat"><span class="label">Avg Response:</span><span class="value" id="gAvgResp" style="color:var(--cyan)">—</span></div>
  <div class="global-stat"><span class="label">Checks:</span><span class="value" id="gChecks">0</span></div>
</div>

<div class="grid" id="cardsGrid"></div>

<div class="graph-section">
  <div class="graph-card">
    <h3>📊 Response Time History (last 30 checks — site ping)</h3>
    <div class="graph-container" id="graph"></div>
    <div class="graph-labels"><span id="graphOldest"></span><span id="graphNewest"></span></div>
  </div>
</div>

<div class="footer">
  <a href="https://blockgenomics.io" target="_blank">blockgenomics.io</a> · Monitoring by Pepe 🐸 · Auto-refreshes every <span id="footerInterval">60</span>s
</div>

<script>
const BASE = 'https://blockgenomics.io';
const STORAGE_KEY = 'bg-monitor-history';
const MAX_HISTORY = 30;

const services = [
  { id:'site', name:'Site Status', icon:'🌐', endpoint:'/', desc:'Main site reachability' },
  { id:'brain', name:'Nexus Brain', icon:'🧠', endpoint:'/api/v1/brain/status', desc:'AI scanning engine' },
  { id:'guardian', name:'Guardian (720143)', icon:'🛡️', endpoint:'/api/v1/guardian/cmln9i4730000js04ff5gj4un', desc:'Block 720143 Guardian agent' },
  { id:'users', name:'User Stats', icon:'👥', endpoint:'/api/v1/users?limit=1', desc:'Registered user count' },
  { id:'agents', name:'Agent Directory', icon:'🤖', endpoint:'/api/v1/agents?limit=1', desc:'Deployed agents' },
  { id:'search', name:'Search Activity', icon:'🔍', endpoint:'/api/v1/search?q=test', desc:'Search endpoint health' },
  { id:'blocks', name:'Block Explorer', icon:'📦', endpoint:'/api/v1/blocks?limit=1', desc:'Block database' },
];

let state = {};
let timer = null;

// Init cards
function initCards() {
  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = services.map(s => `
    <div class="card" id="card-${s.id}" onclick="toggleCard('${s.id}')">
      <div class="card-header">
        <div class="card-title">
          <span class="card-icon">${s.icon}</span>
          <span>${s.name}</span>
          <span class="status-dot unknown" id="dot-${s.id}"></span>
        </div>
        <div style="display:flex;align-items:center;gap:.75rem">
          <span class="resp-time" id="resp-${s.id}"></span>
          <span class="chevron">▼</span>
        </div>
      </div>
      <div class="card-body" id="body-${s.id}">
        <div class="row"><span class="k">Endpoint</span><span class="v">${s.endpoint}</span></div>
        <div id="details-${s.id}"></div>
      </div>
    </div>
  `).join('');
}

function toggleCard(id) {
  document.getElementById('card-'+id).classList.toggle('expanded');
}

async function checkService(svc) {
  const dot = document.getElementById('dot-'+svc.id);
  const resp = document.getElementById('resp-'+svc.id);
  const details = document.getElementById('details-'+svc.id);
  dot.className = 'status-dot checking';
  const t0 = performance.now();
  let result = { id:svc.id, status:'down', ms:0, time:Date.now(), data:null, error:null };
  try {
    const r = await fetch(BASE + svc.endpoint, { mode:'cors', cache:'no-store', signal:AbortSignal.timeout(10000) });
    result.ms = Math.round(performance.now() - t0);
    if (r.ok) {
      result.status = result.ms > 3000 ? 'degraded' : 'online';
      try { result.data = await r.json(); } catch { result.data = { note: 'HTML response (not JSON)' }; }
    } else {
      result.status = 'degraded';
      result.error = `HTTP ${r.status}`;
    }
  } catch(e) {
    result.ms = Math.round(performance.now() - t0);
    if (e.name === 'TypeError' && e.message.includes('Failed to fetch')) {
      result.status = 'degraded';
      result.error = 'CORS blocked or network error — check server-side';
    } else if (e.name === 'TimeoutError') {
      result.error = 'Timeout (>10s)';
    } else {
      result.error = e.message;
    }
  }
  // Update UI
  dot.className = 'status-dot ' + result.status;
  resp.textContent = result.ms + 'ms';
  let detailsHtml = '';
  if (result.error) detailsHtml += `<div class="error-msg">⚠️ ${result.error}</div>`;
  if (result.data) {
    const rows = extractDetails(svc.id, result.data);
    detailsHtml += rows.map(([k,v])=>`<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
  }
  details.innerHTML = detailsHtml;
  return result;
}

function extractDetails(id, data) {
  if (!data || typeof data !== 'object') return [];
  switch(id) {
    case 'brain': return [
      ['Status', data.status||data.state||'—'],
      ['Last Scan', data.lastScanTime||data.lastScan||'—'],
      ['Total Scans', data.totalScans??data.scans??'—'],
      ['Flagged', data.flaggedContent??data.flagged??'—'],
    ];
    case 'guardian': return [
      ['Status', data.status||'—'],
      ['Owner', data.owner||data.ownerName||'—'],
      ['LLM Model', data.llmModel||data.model||'—'],
      ['Last Activity', data.lastActivity||data.updatedAt||'—'],
      ['Block', data.blockNumber||data.block||'720143'],
    ];
    case 'users': return [
      ['Total Users', data.total??data.count??data.length??'—'],
    ];
    case 'agents': return [
      ['Total Agents', data.total??data.count??data.length??'—'],
    ];
    case 'search': return [
      ['Results', Array.isArray(data.results)?data.results.length:(data.total??'—')],
      ['Query', 'test'],
    ];
    case 'blocks': return [
      ['Total Blocks', data.total??data.count??'—'],
    ];
    case 'site': return [['Response', data.note||'OK']];
    default: return Object.entries(data).slice(0,5).map(([k,v])=>[k,typeof v==='object'?JSON.stringify(v):v]);
  }
}

function getHistory() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
}
function saveHistory(entry) {
  const h = getHistory();
  h.push(entry);
  if (h.length > MAX_HISTORY) h.splice(0, h.length - MAX_HISTORY);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(h));
}

function renderGraph() {
  const h = getHistory();
  const graph = document.getElementById('graph');
  if (!h.length) { graph.innerHTML = '<span style="color:var(--text-dim);font-size:.8rem;margin:auto">No data yet</span>'; return; }
  const maxMs = Math.max(...h.map(e=>e.ms||0), 100);
  graph.innerHTML = h.map(e => {
    const pct = Math.max(4, ((e.ms||0)/maxMs)*100);
    const cls = e.status==='down'||e.status==='fail'?'fail':e.ms>3000?'slow':'ok';
    const t = new Date(e.time).toLocaleTimeString();
    return `<div class="graph-bar ${cls}" style="height:${pct}%" data-tip="${e.ms}ms @ ${t}"></div>`;
  }).join('');
  document.getElementById('graphOldest').textContent = new Date(h[0].time).toLocaleString();
  document.getElementById('graphNewest').textContent = new Date(h[h.length-1].time).toLocaleString();
}

function updateGlobalStats(results) {
  const online = results.filter(r=>r.status==='online').length;
  const total = results.length;
  document.getElementById('gServices').textContent = `${online}/${total} online`;
  document.getElementById('gServices').style.color = online===total?'var(--green)':online>0?'var(--yellow)':'var(--red)';
  const avg = Math.round(results.reduce((s,r)=>s+r.ms,0)/total);
  document.getElementById('gAvgResp').textContent = avg+'ms';
  // Uptime from history
  const h = getHistory();
  const day = h.filter(e=>e.time > Date.now()-86400000);
  if (day.length) {
    const up = day.filter(e=>e.status==='online').length;
    const pct = ((up/day.length)*100).toFixed(1);
    const el = document.getElementById('gUptime');
    el.textContent = pct+'%';
    el.className = 'value '+(pct>=99?'uptime-good':pct>=90?'uptime-warn':'uptime-bad');
  }
  const allH = getHistory();
  document.getElementById('gChecks').textContent = allH.length;
  document.getElementById('lastCheck').textContent = 'Last: '+new Date().toLocaleTimeString();
}

async function runAllChecks() {
  const btn = document.getElementById('checkBtn');
  btn.classList.add('checking');
  btn.textContent = '⏳ Checking…';
  const results = await Promise.all(services.map(s=>checkService(s)));
  state = Object.fromEntries(results.map(r=>[r.id,r]));
  // Save site ping to history
  const site = results.find(r=>r.id==='site');
  if (site) saveHistory({ ms:site.ms, status:site.status, time:site.time });
  renderGraph();
  updateGlobalStats(results);
  btn.classList.remove('checking');
  btn.textContent = '⚡ Check Now';
}

function setupTimer() {
  if (timer) clearInterval(timer);
  const sec = parseInt(document.getElementById('intervalSelect').value);
  document.getElementById('footerInterval').textContent = sec||'off';
  if (sec > 0) timer = setInterval(runAllChecks, sec*1000);
}

document.getElementById('intervalSelect').addEventListener('change', setupTimer);

// Boot
initCards();
renderGraph();
setupTimer();
runAllChecks();
</script>
</body>
</html>
