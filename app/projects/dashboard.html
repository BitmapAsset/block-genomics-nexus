<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐸 Pepe Command Center</title>
<style>
  :root {
    --bg: #0a0a0f;
    --card: #12121a;
    --card-hover: #1a1a28;
    --border: #2a2a3a;
    --accent: #00d4aa;
    --accent2: #7c3aed;
    --accent3: #f59e0b;
    --text: #e4e4e7;
    --text-dim: #71717a;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --info: #3b82f6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .header h1 {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .header .timestamp {
    color: var(--text-dim);
    font-size: 13px;
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    transition: all 0.2s;
  }

  .stat-card:hover {
    background: var(--card-hover);
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .stat-number {
    font-size: 36px;
    font-weight: 800;
    margin-bottom: 4px;
  }

  .stat-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-dim);
  }

  .stat-card:nth-child(1) .stat-number { color: var(--accent); }
  .stat-card:nth-child(2) .stat-number { color: var(--accent2); }
  .stat-card:nth-child(3) .stat-number { color: var(--success); }
  .stat-card:nth-child(4) .stat-number { color: var(--accent3); }

  .section-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 20px;
    margin-bottom: 32px;
  }

  .project-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }

  .project-card:hover {
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 8px 32px rgba(0, 212, 170, 0.1);
  }

  .project-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
  }

  .project-card.status-complete::before { background: var(--success); }
  .project-card.status-active::before { background: var(--accent); }
  .project-card.status-planning::before { background: var(--accent3); }
  .project-card.status-blocked::before { background: var(--danger); }

  .project-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }

  .project-name {
    font-size: 18px;
    font-weight: 700;
  }

  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .badge-complete { background: rgba(34,197,94,0.15); color: var(--success); }
  .badge-active { background: rgba(0,212,170,0.15); color: var(--accent); }
  .badge-planning { background: rgba(245,158,11,0.15); color: var(--accent3); }
  .badge-blocked { background: rgba(239,68,68,0.15); color: var(--danger); }
  .badge-paused { background: rgba(113,113,122,0.15); color: var(--text-dim); }

  .priority-tag {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    margin-left: 8px;
  }

  .priority-critical { background: rgba(239,68,68,0.2); color: var(--danger); }
  .priority-high { background: rgba(245,158,11,0.2); color: var(--accent3); }
  .priority-medium { background: rgba(59,130,246,0.2); color: var(--info); }
  .priority-low { background: rgba(113,113,122,0.2); color: var(--text-dim); }

  .project-category {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .project-desc {
    font-size: 14px;
    color: var(--text-dim);
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .progress-bar {
    width: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .progress-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.5s ease;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .progress-label {
    font-size: 12px;
    color: var(--text-dim);
    text-align: right;
    margin-bottom: 16px;
  }

  .task-list {
    list-style: none;
  }

  .task-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    font-size: 13px;
    color: var(--text-dim);
    border-bottom: 1px solid rgba(42,42,58,0.5);
  }

  .task-item:last-child { border-bottom: none; }

  .task-item.done {
    color: var(--success);
    text-decoration: line-through;
    opacity: 0.6;
  }

  .task-check {
    width: 16px;
    height: 16px;
    border-radius: 4px;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 10px;
  }

  .task-item.done .task-check {
    background: var(--success);
    border-color: var(--success);
    color: white;
  }

  .timeline {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
  }

  .timeline-item {
    display: flex;
    gap: 16px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }

  .timeline-item:last-child { border-bottom: none; }

  .timeline-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    margin-top: 5px;
    flex-shrink: 0;
  }

  .timeline-content {
    flex: 1;
  }

  .timeline-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .timeline-meta {
    font-size: 12px;
    color: var(--text-dim);
  }

  .footer {
    text-align: center;
    padding: 32px 0 16px;
    color: var(--text-dim);
    font-size: 12px;
  }

  .footer a {
    color: var(--accent);
    text-decoration: none;
  }

  /* Model Monitoring Section */
  .model-section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }

  .model-section-header .model-count {
    font-size: 12px;
    color: var(--text-dim);
    background: rgba(255,255,255,0.05);
    padding: 2px 10px;
    border-radius: 10px;
  }

  .model-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }

  .model-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    position: relative;
    overflow: hidden;
    transition: all 0.3s;
  }

  .model-card.primary {
    border-color: rgba(124,58,237,0.4);
    box-shadow: 0 0 20px rgba(124,58,237,0.06);
  }

  .model-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(0, 212, 170, 0.08);
  }

  .model-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }

  .model-card[data-role="architect"]::before { background: linear-gradient(90deg, #7c3aed, #a78bfa); }
  .model-card[data-role="coding"]::before { background: linear-gradient(90deg, #22c55e, #4ade80); }
  .model-card[data-role="search"]::before { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
  .model-card[data-role="social"]::before { background: linear-gradient(90deg, #ef4444, #f87171); }
  .model-card[data-role="upcoming"]::before { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
  .model-card[data-role="autonomousCoding"]::before { background: linear-gradient(90deg, #00d4aa, #22c55e); }

  .model-card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .model-icon {
    font-size: 28px;
    margin-bottom: 6px;
  }

  .primary-badge {
    font-size: 9px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #a78bfa;
    background: rgba(124,58,237,0.15);
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid rgba(124,58,237,0.3);
  }

  .model-name {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 2px;
  }

  .model-provider {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .model-provider .alias {
    background: rgba(255,255,255,0.06);
    padding: 1px 6px;
    border-radius: 4px;
    font-family: 'SF Mono', monospace;
    font-size: 10px;
  }

  .model-role-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 3px 8px;
    border-radius: 6px;
    margin-bottom: 10px;
  }

  .model-card[data-role="architect"] .model-role-tag { background: rgba(124,58,237,0.15); color: #a78bfa; }
  .model-card[data-role="coding"] .model-role-tag { background: rgba(34,197,94,0.15); color: #4ade80; }
  .model-card[data-role="search"] .model-role-tag { background: rgba(59,130,246,0.15); color: #60a5fa; }
  .model-card[data-role="social"] .model-role-tag { background: rgba(239,68,68,0.15); color: #f87171; }
  .model-card[data-role="upcoming"] .model-role-tag { background: rgba(245,158,11,0.15); color: #fbbf24; }
  .model-card[data-role="autonomousCoding"] .model-role-tag { background: rgba(0,212,170,0.15); color: #00d4aa; }

  .model-desc {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.5;
    margin-bottom: 10px;
  }

  .model-tasks {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 12px;
  }

  .model-task-pill {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text-dim);
    white-space: nowrap;
  }

  .model-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
  }

  .model-status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  .model-status-dot.online { background: var(--success); box-shadow: 0 0 6px var(--success); }
  .model-status-dot.standby { background: var(--accent3); box-shadow: 0 0 6px var(--accent3); }
  .model-status-dot.waiting { background: var(--text-dim); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .project-card, .stat-card, .timeline {
    animation: fadeIn 0.5s ease forwards;
  }

  .project-card:nth-child(2) { animation-delay: 0.1s; }
  .project-card:nth-child(3) { animation-delay: 0.2s; }
</style>
</head>
<body>

<div class="header">
  <h1>🐸 Pepe Command Center</h1>
  <div class="timestamp" id="lastUpdated">Loading...</div>
</div>

<div class="stats-row" id="statsRow"></div>

<div class="section-title">📂 Projects</div>
<div class="projects-grid" id="projectsGrid"></div>

<div class="section-title" style="display:flex;align-items:center;gap:12px;">🤖 Model Usage Monitoring <span style="font-size:12px;color:var(--text-dim);background:rgba(255,255,255,0.05);padding:2px 10px;border-radius:10px;" id="modelCount"></span></div>
<div style="font-size:12px;color:var(--text-dim);margin:-8px 0 16px;line-height:1.5;">4 providers · 5 models · failover chain active — <span style="color:var(--success)">never go offline</span></div>
<div class="model-grid" id="modelGrid"></div>

<div class="section-title">📅 Calendar & Roadmap</div>
<div style="background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 24px;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
    <div style="display: flex; gap: 16px; font-size: 11px;">
      <span style="display:flex;align-items:center;gap:4px;"><span style="width:8px;height:8px;border-radius:50%;background:var(--success);display:inline-block;"></span> Done</span>
      <span style="display:flex;align-items:center;gap:4px;"><span style="width:8px;height:8px;border-radius:50%;background:var(--info);display:inline-block;"></span> Scheduled</span>
      <span style="display:flex;align-items:center;gap:4px;"><span style="width:8px;height:8px;border-radius:50%;background:var(--accent2);display:inline-block;"></span> Target</span>
    </div>
  </div>
  <div id="calendarView"></div>
</div>

<div class="section-title">📜 Activity Log</div>
<div class="timeline" id="timeline"></div>

<div class="footer">
  Pepe Command Center v1.0 — Built for Gravity 🐸<br>
  Auto-refreshes every 30 seconds
</div>

<script>
const DATA_PATH = 'dashboard-data.json';

const statusLabels = {
  complete: 'Complete',
  active: 'Active',
  planning: 'Planning',
  blocked: 'Blocked',
  paused: 'Paused'
};

function renderStats(stats) {
  const container = document.getElementById('statsRow');
  const cards = [
    { number: stats.totalProjects, label: 'Total Projects' },
    { number: stats.active, label: 'Active' },
    { number: stats.completed, label: 'Completed' },
    { number: `${stats.tasksComplete}/${stats.totalTasks}`, label: 'Tasks Done' },
  ];
  container.innerHTML = cards.map(c => `
    <div class="stat-card">
      <div class="stat-number">${c.number}</div>
      <div class="stat-label">${c.label}</div>
    </div>
  `).join('');
}

function renderProjects(projects) {
  const container = document.getElementById('projectsGrid');
  container.innerHTML = projects.map(p => {
    // Flatten phases into a single task list
    const allTasks = (p.phases || []).flatMap(ph => (ph.tasks || []).map(t => ({
      name: t.name,
      done: t.status === 'done',
      phase: ph.name
    })));
    const tasks = allTasks.length ? allTasks : (p.tasks || []);
    const tasksDone = tasks.filter(t => t.done).length;
    const tasksTotal = tasks.length;
    const progress = tasksTotal > 0 ? Math.round((tasksDone / tasksTotal) * 100) : (p.progress || 0);

    // Group by phase for display
    const phases = (p.phases || []);
    const phaseHTML = phases.length ? phases.map(ph => {
      const pTasks = (ph.tasks || []).map(t => ({name: t.name, done: t.status === 'done'}));
      return `
        <div style="margin-top:12px;">
          <div style="font-size:12px;font-weight:600;color:var(--text);margin-bottom:6px;">${ph.name} <span class="badge badge-${ph.status}" style="font-size:9px;padding:2px 6px;">${statusLabels[ph.status] || ph.status}</span></div>
          <ul class="task-list">
            ${pTasks.map(t => `
              <li class="task-item ${t.done ? 'done' : ''}">
                <span class="task-check">${t.done ? '✓' : ''}</span>
                ${t.name}
              </li>
            `).join('')}
          </ul>
        </div>
      `;
    }).join('') : `<ul class="task-list">${tasks.map(t => `
      <li class="task-item ${t.done ? 'done' : ''}">
        <span class="task-check">${t.done ? '✓' : ''}</span>
        ${t.name}
      </li>
    `).join('')}</ul>`;

    return `
      <div class="project-card status-${p.status}">
        <div class="project-header">
          <div>
            <span class="project-name">${p.name}</span>
            <span class="priority-tag priority-${p.priority}">${p.priority.toUpperCase()}</span>
          </div>
          <span class="badge badge-${p.status}">${statusLabels[p.status] || p.status}</span>
        </div>
        <div class="project-desc">${p.description}</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
        <div class="progress-label">${progress}% complete (${tasksDone}/${tasksTotal} tasks)</div>
        ${phaseHTML}
      </div>
    `;
  }).join('');
}

function renderTimeline(projects) {
  const container = document.getElementById('timeline');
  const events = [];

  projects.forEach(p => {
    events.push({ title: `${p.name} created`, date: p.created, type: 'created' });
    if (p.completed) {
      events.push({ title: `${p.name} completed ✅`, date: p.completed, type: 'completed' });
    }
  });

  events.sort((a, b) => new Date(b.date) - new Date(a.date));

  container.innerHTML = events.map(e => `
    <div class="timeline-item">
      <div class="timeline-dot"></div>
      <div class="timeline-content">
        <div class="timeline-title">${e.title}</div>
        <div class="timeline-meta">${e.date}</div>
      </div>
    </div>
  `).join('');
}

const MODEL_ICONS = {
  architect: '🧠',
  coding: '⚡',
  search: '🔍',
  social: '🐦',
  upcoming: '🔮',
  autonomousCoding: '🤖'
};

const STATUS_LABELS = { online: 'ONLINE', standby: 'STANDBY', waiting: 'AWAITING ACCESS' };

function renderModels(modelStrategy) {
  const container = document.getElementById('modelGrid');
  const countEl = document.getElementById('modelCount');
  if (!modelStrategy) { container.innerHTML = '<p style="color:var(--text-dim)">No model data</p>'; return; }

  const entries = Object.entries(modelStrategy);
  const onlineCount = entries.filter(([,m]) => m.status === 'online').length;
  if (countEl) countEl.textContent = `${onlineCount}/${entries.length} online`;

  container.innerHTML = entries.map(([key, m]) => {
    const icon = MODEL_ICONS[key] || '🤖';
    const statusDot = m.status || 'waiting';
    const statusLabel = STATUS_LABELS[statusDot] || 'UNKNOWN';
    const tasks = (m.tasks || []).map(t => `<span class="model-task-pill">${t}</span>`).join('');
    const primaryClass = m.isPrimary ? ' primary' : '';
    const primaryBadge = m.isPrimary ? '<span class="primary-badge">Primary</span>' : '';

    return `
      <div class="model-card${primaryClass}" data-role="${key}">
        <div class="model-card-header">
          <div class="model-icon">${icon}</div>
          ${primaryBadge}
        </div>
        <div class="model-name">${m.model}</div>
        <div class="model-provider">${m.provider || ''}${m.alias ? ` <span class="alias">${m.alias}</span>` : ''}</div>
        <div class="model-role-tag">${m.role || key}</div>
        <div class="model-desc">${m.desc || m.role || ''}</div>
        ${tasks ? `<div class="model-tasks">${tasks}</div>` : ''}
        <div class="model-status">
          <span class="model-status-dot ${statusDot}"></span>
          <span style="color: var(--text-dim)">${statusLabel}</span>
        </div>
      </div>
    `;
  }).join('');
}

function renderCalendar(calendar) {
  const container = document.getElementById('calendarView');
  if (!container || !calendar || !calendar.length) return;

  const today = new Date().toISOString().slice(0, 10);
  const sorted = [...calendar].sort((a, b) => a.date.localeCompare(b.date));
  
  const typeColors = {
    milestone: 'var(--success)',
    scheduled: 'var(--info)',
    target: 'var(--accent2)',
    deadline: 'var(--danger)'
  };
  const typeIcons = {
    milestone: '✅',
    scheduled: '📅',
    target: '🎯',
    deadline: '⚠️'
  };

  // Group by month
  const months = {};
  sorted.forEach(e => {
    const monthKey = e.date.slice(0, 7);
    if (!months[monthKey]) months[monthKey] = [];
    months[monthKey].push(e);
  });

  container.innerHTML = Object.entries(months).map(([month, events]) => {
    const monthName = new Date(month + '-01').toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    return `
      <div style="margin-bottom: 20px;">
        <div style="font-size: 14px; font-weight: 600; color: var(--accent); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.1em;">${monthName}</div>
        ${events.map(e => {
          const isPast = e.date < today;
          const isToday = e.date === today;
          const color = typeColors[e.type] || 'var(--text-dim)';
          const icon = typeIcons[e.type] || '📌';
          const dayNum = new Date(e.date + 'T12:00:00').getDate();
          const dayName = new Date(e.date + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short' });
          const opacity = isPast ? '0.6' : '1';
          const todayBorder = isToday ? 'border: 1px solid var(--accent);' : '';
          return `
            <div style="display: flex; align-items: flex-start; gap: 12px; padding: 8px 12px; margin-bottom: 4px; border-radius: 8px; opacity: ${opacity}; ${todayBorder} background: ${isToday ? 'rgba(0,212,170,0.05)' : 'transparent'};">
              <div style="min-width: 44px; text-align: center;">
                <div style="font-size: 18px; font-weight: 700; color: ${isToday ? 'var(--accent)' : 'var(--text)'};">${dayNum}</div>
                <div style="font-size: 10px; color: var(--text-dim); text-transform: uppercase;">${dayName}</div>
              </div>
              <div style="flex: 1;">
                <div style="font-size: 13px; color: var(--text);">${icon} ${e.event}</div>
                <div style="font-size: 11px; color: var(--text-dim); margin-top: 2px;">${e.project || ''}</div>
              </div>
              <div style="min-width: 8px; height: 8px; border-radius: 50%; background: ${color}; margin-top: 6px;"></div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }).join('');
}

async function loadDashboard() {
  try {
    const resp = await fetch(DATA_PATH + '?t=' + Date.now());
    const data = await resp.json();

    document.getElementById('lastUpdated').textContent =
      'Last updated: ' + new Date(data.lastUpdated).toLocaleString();

    renderStats(data.stats);
    renderProjects(data.projects);
    renderModels(data.modelStrategy);
    renderCalendar(data.calendar);
    renderTimeline(data.projects);
  } catch(e) {
    console.error('Failed to load dashboard data:', e);
  }
}

loadDashboard();
setInterval(loadDashboard, 30000);
</script>
</body>
