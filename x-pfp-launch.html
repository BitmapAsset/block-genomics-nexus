<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 800px; height: 800px; overflow: hidden; background: #000; }
canvas { width: 800px; height: 800px; }
</style>
</head>
<body>
<canvas id="c" width="800" height="800"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const W = 800, H = 800, cx = W/2, cy = H/2;

// Deep space background with radial gradient
const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 420);
bg.addColorStop(0, '#0a0e1a');
bg.addColorStop(0.5, '#050810');
bg.addColorStop(1, '#000003');
ctx.fillStyle = bg;
ctx.fillRect(0, 0, W, H);

// Subtle hex grid pattern
ctx.strokeStyle = 'rgba(247,147,26,0.04)';
ctx.lineWidth = 0.5;
const hexSize = 24;
for (let row = -2; row < 36; row++) {
  for (let col = -2; col < 36; col++) {
    const x = col * hexSize * 1.5 + (row % 2) * hexSize * 0.75;
    const y = row * hexSize * 0.866;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const angle = Math.PI / 3 * i - Math.PI / 6;
      const px = x + hexSize * 0.4 * Math.cos(angle);
      const py = y + hexSize * 0.4 * Math.sin(angle);
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
  }
}

// Outer glow ring
for (let i = 0; i < 3; i++) {
  const r = 280 + i * 30;
  const grad = ctx.createRadialGradient(cx, cy, r - 15, cx, cy, r + 15);
  grad.addColorStop(0, 'rgba(247,147,26,0)');
  grad.addColorStop(0.5, `rgba(247,147,26,${0.03 - i * 0.008})`);
  grad.addColorStop(1, 'rgba(247,147,26,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, r + 15, 0, Math.PI * 2);
  ctx.fill();
}

// DNA Helix — two intertwined strands
function drawDNAHelix(centerX, centerY, radius, turns, points, color1, color2) {
  for (let strand = 0; strand < 2; strand++) {
    const offset = strand * Math.PI;
    ctx.beginPath();
    for (let i = 0; i <= points; i++) {
      const t = i / points;
      const angle = t * turns * Math.PI * 2 + offset;
      const r = radius + Math.sin(t * Math.PI) * 20;
      const x = centerX + Math.cos(angle) * r;
      const y = centerY - 200 + t * 400;
      const depth = Math.sin(angle);
      
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    const grad = ctx.createLinearGradient(centerX - radius, centerY - 200, centerX + radius, centerY + 200);
    grad.addColorStop(0, strand === 0 ? 'rgba(247,147,26,0.6)' : 'rgba(0,200,255,0.5)');
    grad.addColorStop(0.5, strand === 0 ? 'rgba(247,147,26,0.3)' : 'rgba(0,200,255,0.25)');
    grad.addColorStop(1, strand === 0 ? 'rgba(247,147,26,0.6)' : 'rgba(0,200,255,0.5)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 3;
    ctx.stroke();
    
    // Glow
    ctx.strokeStyle = strand === 0 ? 'rgba(247,147,26,0.15)' : 'rgba(0,200,255,0.12)';
    ctx.lineWidth = 8;
    ctx.stroke();
  }
  
  // Cross connections (base pairs)
  for (let i = 0; i < points; i += 4) {
    const t = i / points;
    const angle = t * turns * Math.PI * 2;
    const r = radius + Math.sin(t * Math.PI) * 20;
    const x1 = centerX + Math.cos(angle) * r;
    const y1 = centerY - 200 + t * 400;
    const x2 = centerX + Math.cos(angle + Math.PI) * r;
    const y2 = y1;
    
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

// Left helix
drawDNAHelix(cx - 160, cy, 60, 3, 120, '#f7931a', '#00c8ff');
// Right helix  
drawDNAHelix(cx + 160, cy, 60, 3, 120, '#f7931a', '#00c8ff');

// Central shield shape
function drawShield(x, y, size) {
  ctx.beginPath();
  ctx.moveTo(x, y - size);
  ctx.bezierCurveTo(x + size * 0.8, y - size * 0.8, x + size, y - size * 0.3, x + size, y + size * 0.1);
  ctx.bezierCurveTo(x + size, y + size * 0.6, x + size * 0.3, y + size * 0.9, x, y + size * 1.1);
  ctx.bezierCurveTo(x - size * 0.3, y + size * 0.9, x - size, y + size * 0.6, x - size, y + size * 0.1);
  ctx.bezierCurveTo(x - size, y - size * 0.3, x - size * 0.8, y - size * 0.8, x, y - size);
  ctx.closePath();
}

// Shield glow
drawShield(cx, cy, 130);
ctx.shadowColor = '#f7931a';
ctx.shadowBlur = 60;
ctx.fillStyle = 'rgba(247,147,26,0.08)';
ctx.fill();
ctx.shadowBlur = 0;

// Shield border
drawShield(cx, cy, 120);
const shieldGrad = ctx.createLinearGradient(cx, cy - 120, cx, cy + 132);
shieldGrad.addColorStop(0, 'rgba(247,147,26,0.8)');
shieldGrad.addColorStop(0.5, 'rgba(247,147,26,0.4)');
shieldGrad.addColorStop(1, 'rgba(255,200,50,0.6)');
ctx.strokeStyle = shieldGrad;
ctx.lineWidth = 2.5;
ctx.stroke();

// Shield fill
drawShield(cx, cy, 118);
const shieldFill = ctx.createRadialGradient(cx, cy - 20, 0, cx, cy, 140);
shieldFill.addColorStop(0, 'rgba(15,20,35,0.95)');
shieldFill.addColorStop(1, 'rgba(5,8,16,0.98)');
ctx.fillStyle = shieldFill;
ctx.fill();

// Mondrian bitmap pattern inside shield (subtle)
const mondColors = ['rgba(247,147,26,0.12)', 'rgba(247,147,26,0.08)', 'rgba(247,147,26,0.06)'];
const rects = [
  [cx-80, cy-60, 35, 25], [cx-42, cy-60, 50, 40], [cx+12, cy-60, 28, 25],
  [cx+44, cy-60, 36, 40], [cx-80, cy-32, 35, 30], [cx-80, cy+2, 60, 35],
  [cx-16, cy-16, 40, 53], [cx+28, cy-16, 52, 30], [cx+28, cy+18, 52, 35],
  [cx-80, cy+40, 55, 40], [cx-22, cy+40, 48, 40], [cx+30, cy+56, 50, 24],
];
rects.forEach(([rx, ry, rw, rh], i) => {
  ctx.fillStyle = mondColors[i % 3];
  ctx.fillRect(rx, ry, rw - 2, rh - 2);
});

// ₿ Symbol — large, centered, glowing
ctx.font = 'bold 140px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';

// ₿ glow layers
for (let i = 3; i > 0; i--) {
  ctx.shadowColor = '#f7931a';
  ctx.shadowBlur = i * 20;
  ctx.fillStyle = `rgba(247,147,26,${0.15 * i})`;
  ctx.fillText('₿', cx, cy + 5);
}
ctx.shadowBlur = 0;

// ₿ main
const btcGrad = ctx.createLinearGradient(cx, cy - 70, cx, cy + 70);
btcGrad.addColorStop(0, '#ffd700');
btcGrad.addColorStop(0.3, '#f7931a');
btcGrad.addColorStop(0.7, '#f7931a');
btcGrad.addColorStop(1, '#ffb347');
ctx.fillStyle = btcGrad;
ctx.fillText('₿', cx, cy + 5);

// Crown on top of shield
function drawCrown(x, y, w, h) {
  ctx.beginPath();
  ctx.moveTo(x - w/2, y + h);
  ctx.lineTo(x - w/2, y + h * 0.3);
  ctx.lineTo(x - w/4, y + h * 0.55);
  ctx.lineTo(x, y);
  ctx.lineTo(x + w/4, y + h * 0.55);
  ctx.lineTo(x + w/2, y + h * 0.3);
  ctx.lineTo(x + w/2, y + h);
  ctx.closePath();
}

drawCrown(cx, cy - 145, 70, 35);
const crownGrad = ctx.createLinearGradient(cx, cy - 145, cx, cy - 110);
crownGrad.addColorStop(0, '#ffd700');
crownGrad.addColorStop(1, '#f7931a');
ctx.fillStyle = crownGrad;
ctx.fill();
ctx.strokeStyle = 'rgba(255,215,0,0.6)';
ctx.lineWidth = 1.5;
ctx.stroke();

// Crown jewels
[-1, 0, 1].forEach(i => {
  const jx = cx + i * 17.5;
  const jy = cy - 130 + Math.abs(i) * 5;
  ctx.beginPath();
  ctx.arc(jx, jy, 3.5, 0, Math.PI * 2);
  ctx.fillStyle = i === 0 ? '#00ffcc' : '#ffd700';
  ctx.fill();
  ctx.shadowColor = i === 0 ? '#00ffcc' : '#ffd700';
  ctx.shadowBlur = 8;
  ctx.fill();
  ctx.shadowBlur = 0;
});

// Green verification dot
ctx.beginPath();
ctx.arc(cx + 95, cy + 80, 14, 0, Math.PI * 2);
ctx.fillStyle = '#00ff88';
ctx.shadowColor = '#00ff88';
ctx.shadowBlur = 20;
ctx.fill();
ctx.shadowBlur = 0;
ctx.beginPath();
ctx.arc(cx + 95, cy + 80, 10, 0, Math.PI * 2);
ctx.fillStyle = '#00ff88';
ctx.fill();

// Checkmark inside green dot
ctx.beginPath();
ctx.moveTo(cx + 89, cy + 80);
ctx.lineTo(cx + 93, cy + 84);
ctx.lineTo(cx + 101, cy + 75);
ctx.strokeStyle = '#000';
ctx.lineWidth = 2.5;
ctx.lineCap = 'round';
ctx.lineJoin = 'round';
ctx.stroke();

// Floating particles
for (let i = 0; i < 80; i++) {
  const angle = Math.random() * Math.PI * 2;
  const dist = 180 + Math.random() * 200;
  const x = cx + Math.cos(angle) * dist;
  const y = cy + Math.sin(angle) * dist;
  const size = 0.5 + Math.random() * 2;
  ctx.beginPath();
  ctx.arc(x, y, size, 0, Math.PI * 2);
  ctx.fillStyle = Math.random() > 0.5 ? `rgba(247,147,26,${0.15 + Math.random() * 0.3})` : `rgba(0,200,255,${0.1 + Math.random() * 0.2})`;
  ctx.fill();
}

// Orbital rings
for (let ring = 0; ring < 2; ring++) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(ring * 0.6 - 0.3);
  ctx.scale(1, 0.3);
  ctx.beginPath();
  ctx.arc(0, 0, 250 + ring * 40, 0, Math.PI * 2);
  ctx.restore();
  ctx.strokeStyle = `rgba(0,200,255,${0.08 - ring * 0.02})`;
  ctx.lineWidth = 1;
  ctx.stroke();
}
</script>
</body>
</html>
